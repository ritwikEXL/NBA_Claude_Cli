<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CareIntel — Medicare Stars NBA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
/* ── Variables ─────────────────────────────────────────────────────── */
:root{
  --teal:#FB4E0B;--teal-m:#E03B00;--teal-l:#FD7244;--teal-ll:#FFF1EB;--teal-lll:#FFF8F4;
  --amber:#D97706;--amber-l:#FEF3C7;
  --red:#DC2626;--red-l:#FEE2E2;
  --green:#15803D;--green-l:#DCFCE7;
  --blue:#1D4ED8;--blue-l:#DBEAFE;
  --purple:#7C3AED;--purple-l:#EDE9FE;
  --g900:#111827;--g800:#1F2937;--g700:#374151;--g600:#4B5563;--g500:#6B7280;--g400:#9CA3AF;--g300:#D1D5DB;--g200:#E5E7EB;--g100:#F3F4F6;--g50:#F5F2F0;
  --white:#fff;
  --nav-h:56px;
  --r:10px;--r-sm:5px;--r-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06);
  --card-border:1px solid #E5D4CC;
}
/* ── Reset & Base ──────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14px;color:var(--g900);background:#F5F2F0;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.45rem .7rem;white-space:nowrap}
th{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--g600);background:var(--g50);border-bottom:1px solid var(--g200)}
td{border-bottom:1px solid var(--g100);font-size:.81rem}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}
/* ── Nav ───────────────────────────────────────────────────────────── */
#nav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:100;
  background:var(--teal);color:var(--white);
  display:flex;align-items:center;gap:.75rem;padding:0 1.25rem;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.nav-brand{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.nav-mark{
  width:32px;height:32px;border-radius:8px;
  background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.nav-brand strong{font-size:1rem;letter-spacing:.02em;font-weight:700}
.nav-brand span{font-size:.69rem;opacity:.7;display:block;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.nav-sep{width:1px;height:28px;background:rgba(255,255,255,.2);margin:0 .4rem}
.nav-tabs{display:flex;gap:.25rem;flex:1}
.nav-tab{
  padding:.28rem .85rem;border-radius:6px;font-size:.81rem;font-weight:500;
  background:transparent;color:rgba(255,255,255,.72);border:1.5px solid transparent;
  transition:all .15s;
}
.nav-tab:hover{background:rgba(255,255,255,.1);color:var(--white)}
.nav-tab.active{background:rgba(255,255,255,.18);color:var(--white);border-color:rgba(255,255,255,.3)}
.nav-right{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.status-pill{
  display:flex;align-items:center;gap:.4rem;
  background:rgba(255,255,255,.12);border-radius:20px;
  padding:.2rem .65rem;font-size:.75rem;color:rgba(255,255,255,.9);
}
.status-dot{width:7px;height:7px;border-radius:50%;background:#6EE7B7;transition:background .4s}
.status-dot.active{background:#FCD34D;animation:pulse-dot 1.6s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.35}}
.run-id-badge{
  font-size:.71rem;font-family:monospace;
  background:rgba(255,255,255,.12);padding:.2rem .6rem;border-radius:4px;
  color:rgba(255,255,255,.85);display:none;
}
.run-id-badge.visible{display:block}
/* ── Page & Views ──────────────────────────────────────────────────── */
#page{margin-top:var(--nav-h)}
.view{display:none;padding:1.4rem 1.75rem}
.view.active{display:block}
/* ── Stat Strip ────────────────────────────────────────────────────── */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.2rem}
.stat-card{
  background:var(--white);border-radius:var(--r);padding:.9rem 1rem;
  box-shadow:var(--shadow);border:var(--card-border);border-top:3px solid var(--teal);
}
.stat-card .label{font-size:.71rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--g600)}
.stat-card .val{font-size:1.65rem;font-weight:700;color:var(--g900);line-height:1.2;margin:.2rem 0}
.stat-card .sub{font-size:.74rem;color:var(--g400)}
/* ── Section Headers ───────────────────────────────────────────────── */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.65rem}
.section-head h2{font-size:.9rem;font-weight:700;color:var(--g900)}
.section-head small,.section-head .sub{font-size:.74rem;color:var(--g400)}
/* ── Badges ────────────────────────────────────────────────────────── */
.badge{display:inline-block;padding:.13rem .5rem;border-radius:20px;font-size:.69rem;font-weight:600;letter-spacing:.03em}
.badge-high{background:#FEF9C3;color:#854D0E;border:1px solid #FDE68A}
.badge-medium{background:#DBEAFE;color:#1E40AF;border:1px solid #BFDBFE}
.badge-low{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0}
.badge-teal{background:var(--teal-ll);color:var(--teal);border:1px solid #FAB89C}
.badge-blue{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.badge-amber{background:var(--amber-l);color:var(--amber)}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-red{background:#FEE2E2;color:var(--red)}
.badge-gray{background:var(--g100);color:var(--g600)}
.ch-EMAIL{background:#EDE9FE;color:#6D28D9;padding:.13rem .45rem;border-radius:4px;font-size:.69rem;font-weight:600}
.ch-SMS{background:#FEF3C7;color:#92400E;padding:.13rem .45rem;border-radius:4px;font-size:.69rem;font-weight:600}
.ch-CALL{background:#DCFCE7;color:#166534;padding:.13rem .45rem;border-radius:4px;font-size:.69rem;font-weight:600}
.ch-WA{background:#DCF8C6;color:#075E54;padding:.13rem .45rem;border-radius:4px;font-size:.69rem;font-weight:600}
/* ── Score Bar ─────────────────────────────────────────────────────── */
.score-bar{display:flex;align-items:center;gap:.45rem}
.score-bar .track{flex:1;height:5px;background:var(--g200);border-radius:3px;overflow:hidden}
.score-bar .fill{height:100%;border-radius:3px;background:var(--teal-m)}
.score-bar .num{font-size:.76rem;font-weight:600;color:var(--g800);width:2.6rem;text-align:right}
/* ── Star Weight Dots ──────────────────────────────────────────────── */
.sw-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:.3rem;vertical-align:middle}
.sw-1{background:#9CA3AF}.sw-1-5{background:#60A5FA}.sw-2{background:#F59E0B}
/* ── Opportunities Table ───────────────────────────────────────────── */
.opp-table-wrap{background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:auto;border:var(--card-border)}
.opp-table td{vertical-align:middle}
.measure-name{font-weight:600;font-size:.81rem;color:var(--g900)}
.measure-sub{font-size:.7rem;color:var(--g400);font-weight:400;display:block;white-space:normal;max-width:190px}
.plan-name{font-weight:600;font-size:.81rem}
.plan-sub{font-size:.7rem;color:var(--g400);display:block}
.star-prog{font-size:.77rem;display:flex;align-items:center;gap:.3rem}
.star-now{font-weight:700;color:var(--g800)}
.star-target{color:var(--teal);font-weight:700}
.composite-score{font-size:.84rem;font-weight:700;color:var(--g900)}
.select-opp-btn{
  padding:.28rem .75rem;border-radius:6px;font-size:.74rem;font-weight:600;
  background:var(--teal);color:var(--white);border:none;cursor:pointer;
  transition:background .15s;white-space:nowrap;
}
.select-opp-btn:hover{background:var(--teal-m)}
/* ── Run Session Layout ────────────────────────────────────────────── */
.run-layout{display:grid;grid-template-columns:41% 1fr;gap:1.2rem;align-items:start}
/* ── Stepper ───────────────────────────────────────────────────────── */
.stepper{background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:1.1rem 1rem;border:var(--card-border)}
.stepper-title{font-size:.79rem;font-weight:700;color:var(--g800);margin-bottom:.9rem;padding-bottom:.5rem;border-bottom:1px solid var(--g200);font-family:monospace}
.step-row{display:flex;gap:.7rem;position:relative}
.step-row:not(:last-child)::after{content:'';position:absolute;left:13px;top:27px;bottom:-12px;width:2px;background:var(--g200);z-index:0}
.step-row.completed::after{background:var(--teal-l)}
.step-row+.step-row{margin-top:12px}
.step-dot{
  width:27px;height:27px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.73rem;font-weight:700;z-index:1;
  background:var(--g200);color:var(--g600);border:2px solid var(--g200);transition:all .25s;
}
.step-row.active .step-dot{background:var(--teal);color:var(--white);border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-ll)}
.step-row.completed .step-dot{background:var(--green);color:var(--white);border-color:var(--green)}
.step-body{flex:1;min-width:0;padding-bottom:.4rem}
.step-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.12rem}
.step-agent{font-size:.81rem;font-weight:700;color:var(--g900)}
.step-role{font-size:.71rem;color:var(--g400);margin-bottom:.45rem}
.step-summary{font-size:.75rem;color:var(--teal);background:var(--teal-lll);padding:.28rem .5rem;border-radius:4px;margin-top:.2rem}
.step-badge-pending{font-size:.67rem;color:var(--g400);background:var(--g100);padding:.1rem .4rem;border-radius:20px}
.step-badge-active{font-size:.67rem;color:var(--amber);background:var(--amber-l);padding:.1rem .4rem;border-radius:20px;font-weight:600}
.step-badge-done{font-size:.67rem;color:var(--green);background:var(--green-l);padding:.1rem .4rem;border-radius:20px;font-weight:600}
/* ── Step Content ──────────────────────────────────────────────────── */
.step-content{margin-top:.45rem;display:flex;flex-direction:column;gap:.55rem}
.opp-sel-cards{display:flex;flex-direction:column;gap:.45rem}
.opp-sel-card{
  border:2px solid var(--g200);border-radius:var(--r);padding:.65rem .75rem;cursor:pointer;
  transition:border-color .15s,box-shadow .15s;background:var(--white);
}
.opp-sel-card:hover{border-color:var(--teal-m)}
.opp-sel-card.selected{border-color:var(--teal);box-shadow:0 0 0 3px rgba(241,90,34,.12);background:var(--teal-lll)}
.opp-sel-card .osc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem}
.opp-sel-card .osc-title{font-size:.8rem;font-weight:700;color:var(--g900)}
.opp-sel-card .osc-meta{display:flex;gap:.55rem;flex-wrap:wrap;font-size:.71rem;color:var(--g600)}
.cohort-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.cohort-card{border:1px solid var(--g200);border-radius:var(--r);padding:.7rem;background:var(--white)}
.cohort-card.c1{border-top:3px solid var(--teal)}
.cohort-card.c2{border-top:3px solid var(--amber)}
.cohort-card .cc-name{font-size:.77rem;font-weight:700;color:var(--g900);margin-bottom:.22rem}
.cohort-card .cc-rule{font-size:.68rem;color:var(--g600);margin-bottom:.38rem;line-height:1.4}
.cohort-card .cc-stats{display:flex;flex-direction:column;gap:.18rem}
.cohort-card .cc-stat{display:flex;justify-content:space-between;font-size:.71rem}
.cohort-card .cc-stat .k{color:var(--g400)}.cohort-card .cc-stat .v{font-weight:600;color:var(--g800)}
.camp-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.camp-card{
  border:2px solid var(--g200);border-radius:var(--r);padding:.7rem;cursor:pointer;
  transition:all .15s;position:relative;background:var(--white);
}
.camp-card:hover{border-color:var(--teal-m)}
.camp-card.selected{border-color:var(--teal);background:var(--teal-lll)}
.camp-card .rec-badge{
  position:absolute;top:-.5rem;right:.55rem;
  font-size:.64rem;font-weight:700;background:var(--teal);color:var(--white);
  padding:.08rem .42rem;border-radius:20px;
}
.camp-card .cc-name{font-size:.76rem;font-weight:700;color:var(--g900);margin-bottom:.2rem}
.camp-card .cc-desc{font-size:.68rem;color:var(--g600);margin-bottom:.35rem;line-height:1.4}
.camp-card .cc-row{display:flex;gap:.3rem;font-size:.7rem;margin-bottom:.18rem;align-items:flex-start}
.camp-card .cc-row .k{color:var(--g400);flex-shrink:0;width:3.2rem}
.camp-card .cc-row .v{color:var(--g800);font-weight:500}
.camp-card .cc-tradeoff{font-size:.68rem;color:var(--g600);border-top:1px solid var(--g200);margin-top:.35rem;padding-top:.35rem}
.step4-loading{display:flex;align-items:center;gap:.55rem;padding:.45rem;color:var(--g600);font-size:.77rem}
.spinner{width:17px;height:17px;border:2px solid var(--g200);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.outreach-summary{background:var(--teal-lll);border:1px solid #FAD0BD;border-radius:var(--r);padding:.7rem}
.outreach-summary .os-title{font-size:.77rem;font-weight:700;color:var(--teal);margin-bottom:.35rem}
.outreach-summary .os-row{display:flex;justify-content:space-between;font-size:.73rem;margin-bottom:.18rem}
.outreach-summary .os-row .k{color:var(--g600)}.outreach-summary .os-row .v{font-weight:600;color:var(--g900)}
.channel-breakdown{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.35rem}
.btn{padding:.42rem 1rem;border-radius:6px;font-size:.79rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--teal);color:var(--white);border:none}
.btn-primary:hover{background:var(--teal-m)}
.btn-secondary{background:var(--white);color:var(--teal);border:1.5px solid var(--teal)}
.btn-secondary:hover{background:var(--teal-lll)}
.btn-ghost{background:var(--white);color:var(--g600);border:1.5px solid var(--g200)}
.btn-ghost:hover{background:var(--g100)}
.btn-row{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.5rem}
.no-session{background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:2rem;text-align:center;border:var(--card-border)}
.no-session h2{font-size:1rem;font-weight:700;color:var(--g900);margin-bottom:.4rem}
.no-session p{font-size:.79rem;color:var(--g600);margin-bottom:1rem}
.no-session .hint{font-size:.72rem;color:var(--g400);margin-top:.4rem}
.success-banner{
  background:var(--green-l);border:1.5px solid #86EFAC;border-radius:var(--r);
  padding:.7rem .9rem;display:flex;align-items:center;gap:.55rem;margin-top:.6rem;
  animation:fadeIn .4s ease;
}
.success-banner .sb-icon{font-size:1.1rem}
.success-banner .sb-text strong{font-size:.8rem;color:var(--green);display:block}
.success-banner .sb-text span{font-size:.73rem;color:var(--g600)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
/* ── Right Panel ───────────────────────────────────────────────────── */
.run-right{display:flex;flex-direction:column;gap:.9rem}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.kpi-tile{
  background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);
  padding:.8rem .9rem;border:var(--card-border);border-left:3px solid var(--teal);
}
.kpi-tile .kpi-label{font-size:.69rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--g600)}
.kpi-tile .kpi-val{font-size:1.35rem;font-weight:700;color:var(--g900);line-height:1.2;margin:.18rem 0}
.kpi-tile .kpi-sub{font-size:.69rem;color:var(--g400)}
.kpi-tile.dim .kpi-val{color:var(--g300)}
.pipeline{display:flex;align-items:stretch;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pipe-agent{flex:1;padding:.6rem .55rem;border-right:1px solid var(--g100);text-align:center;transition:all .3s}
.pipe-agent:last-child{border-right:none}
.pipe-agent.active{background:var(--teal-ll);animation:pulse-bg 2s ease-in-out infinite}
.pipe-agent.done{background:var(--green-l)}
@keyframes pulse-bg{0%,100%{background:var(--teal-ll)}50%{background:#FDDDD2}}
.pipe-agent .pa-name{font-size:.71rem;font-weight:700;color:var(--g800);margin-bottom:.18rem}
.pipe-agent .pa-status{font-size:.66rem;color:var(--g400)}
.pipe-agent.active .pa-status{color:var(--teal);font-weight:600}
.pipe-agent.done .pa-status{color:var(--green);font-weight:600}
.pipe-agent .pa-summary{font-size:.65rem;color:var(--g600);margin-top:.18rem;white-space:normal;line-height:1.3}
.pipe-arrow{display:flex;align-items:center;background:var(--white);padding:0 .08rem;color:var(--g300);font-size:.85rem}
.table-wrap{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:260px;border:var(--card-border)}
.empty-table{padding:1.4rem;text-align:center;color:var(--g400);font-size:.77rem}
.trace-new{animation:fadeIn .5s ease forwards}
.loading-opp{padding:3rem;text-align:center;color:var(--g400);font-size:.81rem;display:flex;flex-direction:column;align-items:center;gap:.7rem}
.loading-spinner{width:26px;height:26px;border:3px solid var(--g200);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
.error-banner{background:var(--red-l);border:1.5px solid #FECACA;border-radius:var(--r);padding:.7rem 1rem;color:var(--red);font-size:.79rem}
.mt-xs{margin-top:.35rem}.mt-sm{margin-top:.65rem}
/* ── Mode Toggle ───────────────────────────────────────────────────── */
.mode-toggle-wrap{background:var(--g50);border:1.5px solid var(--g200);border-radius:var(--r);padding:.6rem .75rem;margin-top:.45rem;cursor:pointer;transition:border-color .15s;user-select:none}
.mode-toggle-wrap:hover{border-color:var(--teal-m)}
.mode-toggle-wrap.auto-on{background:var(--teal-lll);border-color:var(--teal-l)}
.mode-toggle-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.28rem}
.mode-toggle-label{font-size:.77rem;font-weight:700;color:var(--g800)}
.toggle-visual{width:38px;height:20px;background:var(--g300);border-radius:20px;position:relative;transition:background .2s;flex-shrink:0}
.toggle-visual::after{content:'';position:absolute;width:14px;height:14px;background:var(--white);border-radius:50%;top:3px;left:3px;transition:transform .2s}
.toggle-visual.on{background:var(--teal)}
.toggle-visual.on::after{transform:translateX(18px)}
.mode-desc{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--g600)}
/* ── Auto-status ───────────────────────────────────────────────────── */
.auto-status-bar{background:var(--teal-ll);border:1px solid #FAD0BD;border-radius:var(--r);padding:.55rem .75rem;display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem}
.auto-pulse{width:8px;height:8px;border-radius:50%;background:var(--teal);flex-shrink:0;animation:pulse-dot 1.2s ease-in-out infinite}
.auto-status-bar .as-text{font-size:.75rem;color:var(--teal);font-weight:600}
/* ── Gap Closure Banner ────────────────────────────────────────────── */
.gap-banner{background:var(--green-l);border:1.5px solid #86EFAC;border-radius:var(--r);padding:.6rem .85rem;display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.gap-banner .gb-icon{font-size:1.05rem}
/* ── Send / Delivery ───────────────────────────────────────────────── */
.btn-send{font-size:.72rem;padding:.28rem .6rem;border-radius:6px;border:1.5px solid var(--teal);background:var(--white);color:var(--teal);cursor:pointer;font-family:inherit;font-weight:600;white-space:nowrap;transition:background .15s}
.btn-send:hover:not(:disabled){background:var(--teal-ll)}
.btn-send:disabled{opacity:.5;cursor:not-allowed}
.btn-send.sending{background:var(--teal-ll);color:var(--teal);border-color:var(--teal-m)}
.btn-send.sent{background:#D1FAE5;border-color:#6EE7B7;color:#065F46}
.btn-send.failed{background:#FEE2E2;border-color:#FCA5A5;color:var(--red)}
.btn-send-all{font-size:.76rem;padding:.32rem .75rem;border-radius:7px;border:1.5px solid var(--teal);background:var(--teal);color:var(--white);cursor:pointer;font-family:inherit;font-weight:700;transition:opacity .15s}
.btn-send-all:hover:not(:disabled){opacity:.88}
.btn-send-all:disabled{opacity:.5;cursor:not-allowed}
.msg-preview{background:var(--g50);border:1px solid var(--g200);border-radius:6px;padding:.45rem .6rem;font-size:.71rem;color:var(--g700);margin-top:.3rem;line-height:1.45;white-space:pre-wrap}
.send-count-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:600;color:var(--teal);background:var(--teal-ll);border-radius:20px;padding:.15rem .55rem;margin-left:.4rem}
/* ── SCHEDULED / Call badge ────────────────────────────────────────────── */
.badge-amber{background:#FEF3C7;color:#92400E;border:1px solid #FCD34D}
/* ── SUPPRESSED badge ──────────────────────────────────────────────────── */
.badge-gray{background:var(--g100);color:var(--g500);border:1px solid var(--g200)}
/* ── Retry button ──────────────────────────────────────────────────────── */
.btn-retry{font-size:.72rem;padding:.28rem .6rem;border-radius:6px;border:1.5px solid var(--red);background:#FFF5F5;color:var(--red);cursor:pointer;font-family:inherit;font-weight:600;white-space:nowrap}
.btn-retry:hover{background:#FEE2E2}
/* ── Delivery progress panel ───────────────────────────────────────────── */
.delivery-panel{background:var(--white);border:1.5px solid #FAD4C7;border-radius:var(--r-lg);padding:.75rem 1rem;margin-bottom:.75rem}
.delivery-panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.delivery-panel-hdr h3{font-size:.82rem;font-weight:700;color:var(--g900);margin:0}
.dp-counts{font-size:.73rem;color:var(--g500)}
.dp-bar-wrap{background:var(--g100);border-radius:20px;height:8px;overflow:hidden;margin-bottom:.5rem}
.dp-bar-fill{height:100%;background:var(--teal);border-radius:20px;transition:width .4s ease}
.dp-row{display:flex;align-items:center;gap:.5rem;padding:.28rem 0;border-bottom:1px solid var(--g100);font-size:.73rem}
.dp-row:last-child{border-bottom:none}
.dp-ch-icon{font-size:.95rem;flex-shrink:0}
.dp-contact{flex:1;color:var(--g700);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-msg-preview{font-size:.68rem;color:var(--g500);font-style:italic;margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.dp-spinner{width:12px;height:12px;border:2px solid var(--g200);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
.dp-final-summary{background:var(--green-l);border:1.5px solid #86EFAC;border-radius:var(--r);padding:.6rem .85rem;margin-top:.5rem;font-size:.76rem;font-weight:600;color:#065F46}
/* ── Manual mode outreach label ─────────────────────────────────────────── */
.outreach-manual-label{font-size:.75rem;color:var(--g500);margin:.35rem 0 .5rem;font-style:italic}
/* ── Message preview row ─────────────────────────────────────────────────── */
.msg-preview-label{font-size:.68rem;color:var(--g400);font-style:italic;margin-bottom:.18rem}
.ch-icon{margin-right:.25rem}
.gap-banner .gb-txt strong{font-size:.79rem;color:var(--green);display:block}
.gap-banner .gb-txt span{font-size:.72rem;color:var(--g600)}
/* ── History Dropdown ──────────────────────────────────────────────── */
.history-wrap{position:relative}
.history-btn{display:flex;align-items:center;gap:.3rem;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);border-radius:6px;padding:.22rem .6rem;font-size:.74rem;color:rgba(255,255,255,.9);cursor:pointer;transition:background .15s}
.history-btn:hover{background:rgba(255,255,255,.2)}
.history-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:340px;background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow-md);border:1px solid var(--g200);overflow:hidden;z-index:200;animation:fadeIn .15s ease}
.hist-head{padding:.55rem .8rem;font-size:.76rem;font-weight:700;color:var(--g800);border-bottom:1px solid var(--g200);background:var(--g50)}
.hist-item{padding:.5rem .8rem;border-bottom:1px solid var(--g100);cursor:pointer;transition:background .1s}
.hist-item:last-child{border-bottom:none}
.hist-item:hover{background:var(--teal-lll)}
.hist-item.active-run{background:var(--teal-ll)}
.hist-item .hi-run{font-size:.69rem;font-family:monospace;color:var(--g400)}
.hist-item .hi-opp{font-size:.76rem;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:.1rem 0}
.hist-item .hi-meta{display:flex;gap:.5rem;font-size:.68rem;color:var(--g400)}
.hist-empty{padding:1rem;text-align:center;color:var(--g400);font-size:.76rem}
/* ── Back button ───────────────────────────────────────────────────── */
.btn-back{font-family:inherit;font-size:.74rem;font-weight:500;color:var(--g600);background:var(--g100);border:1.5px solid var(--g200);border-radius:6px;padding:.38rem .75rem;cursor:pointer;transition:all .15s}
.btn-back:hover{background:var(--g200);color:var(--g800)}
/* ── Cohort card selection states ──────────────────────────────────── */
.cohort-card.coh-selected{border-color:var(--teal);box-shadow:0 0 0 2px rgba(241,90,34,.14)}
.cohort-card.coh-selected .cohort-count-badge{color:var(--teal)}
.cohort-card.coh-unselected{opacity:.45;filter:grayscale(.4)}
.coh-sel-badge{display:inline-block;font-size:.66rem;font-weight:700;background:var(--teal);color:var(--white);border-radius:20px;padding:.08rem .42rem;margin-bottom:.25rem}
/* ── Opp refresh notice ────────────────────────────────────────────── */
.opp-refresh{background:var(--teal-ll);border:1px solid #FAD0BD;border-radius:var(--r);padding:.45rem .8rem;font-size:.75rem;color:var(--teal);display:flex;align-items:center;gap:.4rem;margin-bottom:.6rem}
/* ── Context opp cards ─────────────────────────────────────────────── */
.opp-sel-card.ctx{opacity:.65;transform:scale(.98)}
.opp-sel-card.sel-primary{border-color:var(--teal);box-shadow:0 0 0 3px rgba(241,90,34,.14);background:var(--teal-lll)}
/* ── Opportunity filter bar ────────────────────────────────────────── */
.opp-filter-bar{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-bottom:.75rem;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:.6rem .9rem;border:var(--card-border)}
.opp-filter-bar label{font-size:.69rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--g600);margin-right:.2rem}
.opp-filter-bar select{font-family:inherit;font-size:.78rem;border:1.5px solid var(--g200);border-radius:5px;padding:.25rem .55rem;color:var(--g800);background:var(--white);cursor:pointer;outline:none;transition:border-color .15s}
.opp-filter-bar select:focus{border-color:var(--teal-m)}
.filter-clear-btn{font-family:inherit;font-size:.73rem;font-weight:600;color:var(--g600);background:var(--g100);border:1.5px solid var(--g200);border-radius:5px;padding:.25rem .65rem;cursor:pointer;margin-left:auto;transition:all .15s}
.filter-clear-btn:hover{background:var(--g200);color:var(--g800)}
.opp-summary-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:.75rem}
.opp-sum-tile{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:.7rem .9rem;border:var(--card-border);border-left:3px solid var(--teal)}
.opp-sum-tile .ost-label{font-size:.69rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--g600)}
.opp-sum-tile .ost-val{font-size:1.45rem;font-weight:700;color:var(--g900);line-height:1.2;margin:.15rem 0}
.opp-sum-tile .ost-sub{font-size:.7rem;color:var(--g400)}
.opp-sum-tile.ost-high .ost-val{color:var(--amber)}
.opp-sum-tile.ost-impact .ost-val{color:var(--teal)}
/* ── Editable campaign card ────────────────────────────────────────── */
.camp-edit-card{background:var(--white);border:1.5px solid #FAD4C7;border-radius:var(--r-lg);padding:.85rem;margin-top:.5rem}
.camp-edit-card h4{font-size:.78rem;font-weight:700;color:var(--g900);margin-bottom:.6rem;display:flex;align-items:center;gap:.45rem}
.camp-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .75rem;margin-bottom:.6rem}
.camp-field{display:flex;flex-direction:column;gap:.2rem}
.camp-field label{font-size:.68rem;font-weight:600;color:var(--g600);text-transform:uppercase;letter-spacing:.03em}
.camp-field select,.camp-field input[type=text]{font-family:inherit;font-size:.78rem;border:1.5px solid var(--g200);border-radius:5px;padding:.28rem .5rem;color:var(--g800);background:var(--white);outline:none;transition:border-color .15s,background .15s;width:100%}
.camp-field select:focus,.camp-field input[type=text]:focus{border-color:var(--teal-m)}
.camp-field select.edited,.camp-field input[type=text].edited{border-color:var(--amber);background:var(--amber-l)}
.camp-field .cf-readonly{font-size:.78rem;font-weight:600;color:var(--g800);padding:.28rem 0}
.camp-field-full{grid-column:1/-1}
.camp-edit-footer{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.35rem;padding-top:.5rem;border-top:1px solid var(--g100)}
.camp-edit-note{font-size:.69rem;color:var(--g400);flex:1}
/* ── Enhanced cohort cards ─────────────────────────────────────────── */
.cohort-count-badge{font-size:1.8rem;font-weight:800;color:var(--teal);line-height:1;margin-bottom:.15rem}
.cohort-count-label{display:inline-block;background:var(--teal-ll);color:var(--teal);font-size:.69rem;font-weight:700;border-radius:20px;padding:.1rem .5rem;border:1px solid #FAB89C;margin-bottom:.4rem}
.cc-key-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.3rem}
.cc-key-chip{font-size:.69rem;font-weight:600;padding:.12rem .45rem;border-radius:20px}
.cc-key-chip.ch-chip{background:#EDE9FE;color:#6D28D9}
.cc-key-chip.prop-chip{background:var(--teal-ll);color:var(--teal)}
/* ── Opportunities redesign ─────────────────────────────────────── */
.sit-banner{background:linear-gradient(140deg,#7A1800 0%,#C63800 55%,#FB4E0B 100%);border-radius:12px;padding:1.6rem 1.8rem;margin-bottom:1.25rem;color:#fff}
.sit-plan-select{font-family:inherit;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:.35rem .7rem;cursor:pointer;outline:none;margin-bottom:.9rem}
.sit-plan-select option{background:#7A1800;color:#fff}
.sit-stat-box{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:.9rem 1rem;text-align:center}
.sit-stat-box .sv{font-size:1.55rem;font-weight:800;line-height:1.1}
.sit-stat-box .sk{font-size:.71rem;opacity:.75;margin-top:.15rem}
.opp-top-card{background:#fff;border:1.5px solid #FAD4C7;border-radius:12px;box-shadow:var(--shadow-md);margin-bottom:1.1rem;overflow:hidden}
details.opp-top-card>summary{list-style:none;padding:.7rem 1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;background:var(--g50);border-bottom:1px solid var(--g100);user-select:none}
details.opp-top-card>summary::-webkit-details-marker{display:none}
details.opp-top-card>summary:hover{background:#EEEAE7}
details.opp-top-card:not([open])>summary{border-bottom:none;border-radius:12px}
.opp-top-grid{display:grid;grid-template-columns:1.05fr 1.45fr .9fr;min-height:200px}
.opp-top-col{padding:1.15rem 1.3rem}
.opp-top-col+.opp-top-col{border-left:1px solid var(--g100)}
.tier-block{border-radius:8px;padding:.6rem .8rem;margin-bottom:.5rem}
.tier-likely{background:#FEF0EB;border-left:3px solid #F15A22}
.tier-probably{background:#FFFBEB;border-left:3px solid #D97706}
.tier-hightouch{background:#F5F3FF;border-left:3px solid #7C3AED}
.conf-high{background:#DCFCE7;color:#166534;border:1px solid #BBF7D0}
.conf-med{background:#FEF9C3;color:#854D0E;border:1px solid #FDE68A}
.conf-low{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}
.conf-badge{display:inline-block;border-radius:7px;padding:.35rem .85rem;font-size:.78rem;font-weight:700}
.launch-btn{width:100%;padding:.7rem 1rem;background:var(--teal);color:#fff;font-size:.9rem;font-weight:700;border:none;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:.5rem}
.launch-btn:hover{background:var(--teal-m)}
.port-tbl{width:100%;border-collapse:collapse;font-size:.81rem}
.port-tbl th{background:var(--g50);color:var(--g600);font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.5rem .75rem;border-bottom:1px solid var(--g200);white-space:nowrap}
.port-tbl td{padding:.55rem .75rem;border-bottom:1px solid var(--g100)}
.port-tbl tr:hover td{background:var(--g50)}
.section-card{background:#fff;border:1.5px solid #FAD4C7;border-radius:11px;box-shadow:var(--shadow);margin-bottom:1.25rem;overflow:hidden}
.section-card summary{list-style:none;padding:1rem 1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.section-card summary::-webkit-details-marker{display:none}
.section-card summary:hover{background:var(--g50)}
.bp-input{font-family:inherit;font-size:1rem;font-weight:600;border:2px solid var(--g200);border-radius:8px;padding:.5rem .9rem;color:var(--g900);outline:none;width:160px;transition:border-color .15s}
.bp-input:focus{border-color:var(--teal)}
.bp-preset{padding:.35rem .8rem;background:var(--g100);border:1.5px solid var(--g200);border-radius:6px;font-size:.78rem;font-weight:600;color:var(--g600);cursor:pointer;white-space:nowrap;transition:all .15s}
.bp-preset:hover,.bp-preset.active{background:var(--teal-ll);border-color:var(--teal);color:var(--teal)}
.alloc-row{display:flex;align-items:center;gap:.6rem;padding:.4rem .6rem;border-radius:6px;font-size:.79rem}
.alloc-row.full{background:rgba(241,90,34,.06)}
.alloc-row.partial{background:rgba(217,119,6,.05)}
.alloc-row.unfunded{opacity:.45}
.proj-label{font-size:.67rem;color:var(--g500);font-weight:400;margin-left:.2rem}
/* ── Data Sources Tab ──────────────────────────────────────────────── */
.ds-section{margin-bottom:1.5rem}
.ds-section-title{font-size:.88rem;font-weight:700;color:var(--g900);margin-bottom:.6rem}
.ds-section-sub{font-size:.78rem;color:var(--g600);margin-bottom:.9rem}
.ds-status-table{background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:.75rem}
.ds-banner{
  background:var(--amber-l);border:1px solid #F59E0B;border-radius:var(--r);
  padding:.65rem 1rem;font-size:.8rem;color:#92400E;display:flex;align-items:center;gap:.6rem;
  margin-bottom:.75rem;
}
.ds-banner-icon{font-size:1rem;flex-shrink:0}
.ds-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.2rem}
@media(max-width:900px){.ds-cards{grid-template-columns:repeat(2,1fr)}}
.ds-card{
  background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:1.1rem 1.1rem .9rem;border-top:3px solid var(--g200);
  display:flex;flex-direction:column;gap:.5rem;
}
.ds-card.active-card{border-top-color:var(--teal)}
.ds-card-icon{font-size:1.4rem}
.ds-card-name{font-size:.85rem;font-weight:700;color:var(--g900)}
.ds-card-desc{font-size:.76rem;color:var(--g600);flex:1}
.ds-card-actions{display:flex;align-items:center;gap:.5rem;margin-top:.3rem}
.ds-coming-soon{
  display:inline-block;font-size:.67rem;font-weight:700;
  background:var(--g100);color:var(--g600);
  padding:.15rem .5rem;border-radius:10px;letter-spacing:.04em;
}
.ds-btn{
  padding:.32rem .85rem;border-radius:6px;font-size:.78rem;font-weight:600;
  background:var(--teal);color:var(--white);border:none;cursor:pointer;
  transition:background .15s;
}
.ds-btn:hover{background:var(--teal-m)}
.ds-btn-outline{
  padding:.32rem .85rem;border-radius:6px;font-size:.78rem;font-weight:600;
  background:transparent;color:var(--g600);border:1.5px solid var(--g200);cursor:pointer;
  transition:all .15s;
}
.ds-btn-outline:hover{border-color:var(--teal);color:var(--teal)}
.ds-btn-danger{
  padding:.32rem .85rem;border-radius:6px;font-size:.78rem;font-weight:600;
  background:var(--g100);color:var(--g600);border:1.5px solid var(--g200);cursor:pointer;
  transition:all .15s;
}
.ds-btn-danger:hover{background:var(--red-l);color:var(--red);border-color:var(--red)}
.ds-tpl-row{display:flex;gap:.75rem;flex-wrap:wrap}
/* ── Upload Modal ──────────────────────────────────────────────────── */
.ds-modal-backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;
  align-items:center;justify-content:center;
}
.ds-modal-backdrop.open{display:flex}
.ds-modal{
  background:var(--white);border-radius:var(--r-lg);box-shadow:0 8px 32px rgba(0,0,0,.18);
  width:min(660px,94vw);max-height:90vh;overflow-y:auto;
  padding:1.5rem;
}
.ds-modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.ds-modal-title{font-size:.95rem;font-weight:700;color:var(--g900)}
.ds-modal-close{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--g600);padding:.2rem}
.ds-modal-close:hover{color:var(--g900)}
.ds-step-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--g400);margin-bottom:.35rem}
.ds-step-body{margin-bottom:1rem}
.ds-radio-group{display:flex;flex-direction:column;gap:.4rem}
.ds-radio-opt{display:flex;align-items:center;gap:.5rem;font-size:.83rem;cursor:pointer}
.ds-radio-opt input{width:15px;height:15px;accent-color:var(--teal);cursor:pointer}
.ds-drop-zone{
  border:2px dashed var(--g200);border-radius:var(--r-lg);
  padding:1.8rem 1rem;text-align:center;cursor:pointer;
  transition:border-color .15s,background .15s;background:var(--g50);
}
.ds-drop-zone.dragover{border-color:var(--teal);background:var(--teal-lll)}
.ds-drop-icon{font-size:1.8rem;margin-bottom:.4rem}
.ds-drop-hint{font-size:.8rem;color:var(--g600)}
.ds-drop-hint strong{color:var(--teal)}
.ds-file-chosen{margin-top:.5rem;font-size:.77rem;color:var(--g700);font-weight:600}
.ds-preview-wrap{overflow-x:auto;max-height:200px;overflow-y:auto;border:1px solid var(--g200);border-radius:var(--r);font-size:.73rem}
.ds-error-list{background:var(--red-l);border:1px solid var(--red);border-radius:var(--r);padding:.6rem .85rem;font-size:.78rem;color:var(--red);margin-top:.5rem}
.ds-success-banner{background:var(--green-l);border:1px solid var(--green);border-radius:var(--r);padding:.6rem .85rem;font-size:.8rem;color:var(--green);margin-top:.5rem}
.ds-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:var(--white);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:.35rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ── Nav ─────────────────────────────────────────────────────────── -->
<nav id="nav">
  <div class="nav-brand">
    <div class="nav-mark"><svg width="18" height="13" viewBox="0 0 18 13" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.5 6.5h3L5 2.5l3 8 2.5-7L12 9l1.5-2.5H17.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div>
      <strong>CareIntel</strong>
      <span>Medicare Stars · Next Best Action</span>
    </div>
  </div>
  <div id="nav-source-indicator" style="font-size:.7rem;color:rgba(255,255,255,.65);background:rgba(255,255,255,.12);border-radius:4px;padding:.15rem .5rem;margin-left:.3rem">● Demo Data</div>
  <div class="nav-sep"></div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-action="switch-tab" data-val="opp">Opportunities</button>
    <button class="nav-tab" data-action="switch-tab" data-val="eval">Evaluation</button>
    <button class="nav-tab" data-action="switch-tab" data-val="run">Run Session</button>
    <button class="nav-tab" data-action="switch-tab" data-val="data">Data Sources</button>
  </div>
  <div class="nav-right">
    <div class="history-wrap" id="history-wrap">
      <button class="history-btn" data-action="toggle-history">Sessions ▾</button>
    </div>
    <div class="status-pill" id="api-status-pill">
      <div class="status-dot" id="api-dot" style="background:#9CA3AF"></div>
      <span id="api-text">Connecting…</span>
    </div>
    <div class="status-pill">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>
    <div class="run-id-badge" id="run-id-badge"></div>
  </div>
</nav>

<!-- ── Page ─────────────────────────────────────────────────────────── -->
<div id="page">
  <div id="view-opp" class="view active"></div>
  <div id="view-eval" class="view"></div>
  <div id="view-run" class="view">
    <div class="run-layout">
      <div id="run-left"></div>
      <div class="run-right" id="run-right"></div>
    </div>
  </div>
  <div id="view-data" class="view"></div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────────
   CareIntel NBA Dashboard — reads from FastAPI backend
   In local dev: http://localhost:8000
   In production: set CAREINTEL_API_URL meta tag, or auto-detect by host
───────────────────────────────────────────────────────────────────── */

const API=(()=>{
  const meta=document.querySelector('meta[name="careintel-api-url"]');
  if(meta&&meta.content)return meta.content.replace(/\/$/,'');
  if(window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1')
    return 'http://localhost:8000';
  // Same server (Render, any prod host)
  return window.location.origin;
})();

/* ── Utilities ─────────────────────────────────────────────────────── */
function incLabel(c){return{GIFTCARD_15:'$15 Gift Card',GIFTCARD_25:'$25 Gift Card',GIFTCARD_35:'$35 Gift Card',GIFTCARD_50:'$50 Gift Card',FIT_KIT_MAILER:'FIT Kit Mailer (WhatsApp)',TRANSPORT_VOUCHER:'Transport Voucher'}[c]||c||'—'}
function incCost(c){const m=(c||'').match(/GIFTCARD_(\d+)/);if(m)return+m[1];if(c==='FIT_KIT_MAILER')return 8;if(c==='TRANSPORT_VOUCHER')return 20;return 0}
function tmpl(mc,lang){return`TMPL_${mc}_PLAIN${lang!=='EN'?'_'+lang:''}_V1`}
function addDays(iso,n){const d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().split('T')[0]}
function pad2(n){return String(n).padStart(2,'0')}
function nowIso(){return new Date().toISOString().split('.')[0]}

/* ── API helpers ───────────────────────────────────────────────────── */
function _fetchWithTimeout(url,opts={},ms=15000){
  const ctrl=new AbortController();
  const id=setTimeout(()=>ctrl.abort(),ms);
  return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(id));
}
async function apiGet(path){const r=await _fetchWithTimeout(API+path);if(!r.ok)throw new Error(r.status);return r.json();}
async function apiPost(path,body){
  const r=await _fetchWithTimeout(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status);return r.json();
}

/* ── State ─────────────────────────────────────────────────────────── */
const S={
  tab:'opp',status:'idle',phase:0,
  runId:null,loading:true,error:null,apiConnected:null,
  memberMap:{},chanMap:{},
  opportunities:[],
  selectedOppIdx:null,selOpp:null,
  inScopeGaps:[],cohorts:[],selCohorts:[],
  campOptions:[],campIdx:null,campaign:null,campaignId:null,
  step4Loading:false,
  outreachRows:[],decisionRows:[],traceRows:[],
  lastTraceSeen:0,sendState:{},sendAllInProgress:false,openCards:{},
  msgPreviews:{},previewsLoading:false,
  deliveryInProgress:false,deliveryProgress:{total:0,sent:0,failed:0,scheduled:0,results:[]},
  evalData:null,evalLoading:false,evalError:'',evalSelectedRun:'',evalMemberRows:[],evalPlanFilter:'',
  launchedOpps:new Set(),
  convData:{},convPollTimer:null,convSelectedRunId:'',
  simThreads:{},// {contact_id: [{role:'system'|'member', text, ts}]}
  simExpanded:{},// {contact_id: true}
  simBusy:{},// {contact_id: true} typing indicator
  agentSt:{opp:'idle',seg:'idle',camp:'idle',out:'idle'},
  agentSum:{opp:'',seg:'',camp:'',out:''},
  kpis:{gaps:'—',contacts:'—',lift:'—',cost:'—'},
  pollTimer:null,
  // new state
  autoMode:false,autoAborted:false,autoStatus:null,
  gapsBefore:0,gapsAfter:null,
  historyOpen:false,sessionHistory:[],
  // filter state
  filterPlan:'',filterMeasure:'',filterPriority:'',
  // financial opportunities
  oppFinancial:[],oppBudget:500000,oppConnectModal:false,oppForecastPlan:'P005',cardErrors:{},
  // campaign edit overrides
  campEdits:{},// {field: newValue}
  // cohort pending selection
  cohortSelPending:null,// 'both'|'c1'|'c2'|null
};

/* ── API Health ────────────────────────────────────────────────────── */
async function checkApiHealth(){
  try{await apiGet('/opportunities');S.apiConnected=true;}
  catch(e){S.apiConnected=false;}
  renderApiStatus();
}
function renderApiStatus(){
  const dot=document.getElementById('api-dot');
  const txt=document.getElementById('api-text');
  if(S.apiConnected===null){dot.style.background='#9CA3AF';txt.textContent='Connecting…';}
  else if(S.apiConnected){dot.style.background='#6EE7B7';txt.textContent='API Connected';}
  else{dot.style.background='#F87171';txt.textContent='API Offline';}
}

/* ── AI Analysis Trigger ───────────────────────────────────────────── */
// Tracks in-progress analyses so render() can restore button state
const _activeAnalyses={};

// Toast notification — immune to Chrome's "prevent dialogs" suppression
function _aiToast(msg,isError){
  const t=document.createElement('div');
  t.textContent=msg;
  Object.assign(t.style,{
    position:'fixed',bottom:'24px',right:'24px',zIndex:9999,
    background:isError?'#DC2626':'#15803D',color:'#fff',
    padding:'.75rem 1.25rem',borderRadius:'8px',fontSize:'.85rem',
    fontFamily:'inherit',boxShadow:'0 4px 12px rgba(0,0,0,.25)',
    maxWidth:'420px',lineHeight:'1.45',
    transition:'opacity .4s',opacity:'1'
  });
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),400);},isError?8000:4000);
}

function _setCardError(key,msg){
  if(!S.cardErrors)S.cardErrors={};
  if(msg)S.cardErrors[key]=msg;else delete S.cardErrors[key];
}

async function runAiAnalysis(measureKey,planKey){
  console.log('[runAiAnalysis] called:',measureKey,planKey,'API=',API);
  const key=measureKey+'_'+planKey;
  if(_activeAnalyses[key]){console.log('[runAiAnalysis] already in progress, skipping');return;}
  _setCardError(key,null);
  try{
    _activeAnalyses[key]={dots:0};
    try{render();}catch(re){console.error('[AI Analysis] render error:',re);}
    console.log('[runAiAnalysis] posting to',`${API}/financial/analyze/${measureKey}/${planKey}`);
    const kickResp=await fetch(`${API}/financial/analyze/${measureKey}/${planKey}`,{method:'POST'});
    console.log('[runAiAnalysis] kick status',kickResp.status);
    if(!kickResp.ok)throw new Error('HTTP '+kickResp.status+' — is the FastAPI server running on port 8000?');
    const kick=await kickResp.json();
    console.log('[runAiAnalysis] kick response',kick);
    if(kick.status==='cached'){
      console.log('[runAiAnalysis] cached — reloading page to show analysis');
      delete _activeAnalyses[key];
      sessionStorage.setItem('nba_filterPlan',S.filterPlan||'');
      sessionStorage.setItem('nba_analysisKey',key);
      sessionStorage.setItem('nba_tab','opp');
      if(S.oppBudget&&S.oppBudget!==50000)sessionStorage.setItem('nba_oppBudget',String(S.oppBudget));
      window.location.reload();
      return;
    }
    const jobId=kick.job_id;
    let _jobMiss=0;
    const interval=setInterval(async()=>{
      if(!_activeAnalyses[key]){clearInterval(interval);return;}
      _activeAnalyses[key].dots=((_activeAnalyses[key].dots||0)%3)+1;
      const liveBtn=document.querySelector(`[data-analysis-key="${key}"]`);
      if(liveBtn)liveBtn.textContent='Analyzing'+'.'.repeat(_activeAnalyses[key].dots);
      try{
        const st=await apiGet('/financial/analyze-all/status');
        const job=st[jobId];
        console.log('[runAiAnalysis] poll jobId='+jobId,'status=',job&&job.status);
        if(job&&job.status==='complete'){
          clearInterval(interval);
          delete _activeAnalyses[key];
          try{
            const fin=await apiGet('/opportunities/financial');
            const card=fin.find(o=>o.measure_key===measureKey&&o.plan_key===planKey);
            if(card&&card.ai_analysis){
              sessionStorage.setItem('nba_filterPlan',S.filterPlan||'');
              sessionStorage.setItem('nba_analysisKey',key);
              sessionStorage.setItem('nba_tab','opp');
              if(S.oppBudget&&S.oppBudget!==50000)sessionStorage.setItem('nba_oppBudget',String(S.oppBudget));
              window.location.reload();
            }else{
              const errMsg=job.analysis&&job.analysis.error?job.analysis.error:'Analysis ran but produced no output — check ANTHROPIC_API_KEY in .env';
              _setCardError(key,errMsg);
              try{render();}catch(re){console.error('[AI Analysis] render error:',re);}
              _aiToast('Analysis incomplete: '+errMsg,true);
            }
          }catch(fetchErr){
            sessionStorage.setItem('nba_filterPlan',S.filterPlan||'');
            sessionStorage.setItem('nba_analysisKey',key);
            sessionStorage.setItem('nba_tab','opp');
            if(S.oppBudget&&S.oppBudget!==50000)sessionStorage.setItem('nba_oppBudget',String(S.oppBudget));
            window.location.reload();
          }
        }else if(job&&job.status==='error'){
          clearInterval(interval);
          const msg='Analysis error: '+(job.error||'unknown');
          delete _activeAnalyses[key];
          _setCardError(key,msg);
          try{render();}catch(re){console.error('[AI Analysis] render error:',re);}
          _aiToast(msg,true);
        }else if(!job){
          _jobMiss++;
          if(_jobMiss>5){
            clearInterval(interval);
            const msg='Server lost track of the job — please try again.';
            delete _activeAnalyses[key];
            _setCardError(key,msg);
            try{render();}catch(re){};
            _aiToast(msg,true);
          }
        }
      }catch(e){console.error('[AI Analysis] poll error:',e);}
    },3000);
    setTimeout(()=>{
      if(_activeAnalyses[key]){
        clearInterval(interval);
        const msg='Analysis timed out after 3 minutes — server may be busy.';
        delete _activeAnalyses[key];
        _setCardError(key,msg);
        try{render();}catch(re){};
        _aiToast(msg,true);
      }
    },180000);
  }catch(e){
    console.error('[AI Analysis] start error:',e);
    delete _activeAnalyses[key];
    _setCardError(key,'Could not start: '+e.message);
    try{render();}catch(re){console.error('[AI Analysis] render error:',re);}
    _aiToast('Could not start analysis: '+e.message,true);
  }
}
window.runAiAnalysis=runAiAnalysis;

async function runAllAiAnalyses(){
  const btn=document.getElementById('run-all-analyses-btn');
  if(btn){btn.disabled=true;btn.textContent='Running AI analysis…';}
  try{
    await fetch(`${API}/financial/analyze-all`,{method:'POST'});
    // Poll for completion
    let done=false;
    for(let i=0;i<60&&!done;i++){
      await new Promise(r=>setTimeout(r,3000));
      const st=await apiGet('/financial/analyze-all/status');
      const jobs=Object.values(st||{});
      if(jobs.some(j=>j.status==='complete')){done=true;}
    }
    const fin=await apiGet('/opportunities/financial');
    S.financialData=fin;
    render();
    if(btn){btn.disabled=false;btn.textContent='Run All AI Analyses';}
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Run All AI Analyses';}
  }
}

/* ── Data Loading ──────────────────────────────────────────────────── */
async function loadData(){
  S.loading=true;render();
  try{
    const [opps,members,fin]=await Promise.all([apiGet('/opportunities'),apiGet('/members'),apiGet('/opportunities/financial')]);
    // Transform flat API response into nested shape expected by render functions
    S.opportunities=opps.map(r=>({
      measure_key:r.measure_key,plan_key:r.plan_key,
      measure:{measure_key:r.measure_key,measure_code:r.measure_code,measure_name:r.measure_name,
               hedis_domain:r.hedis_domain,star_weight:r.star_weight},
      plan:{plan_key:r.plan_key,plan_name:r.plan_name,region:r.region,segment:r.segment,
            star_rating_current:r.star_rating_current,star_rating_target:r.star_rating_target},
      starWeight:r.star_weight,openCount:r.open_gap_count,
      avgProp:r.avg_propensity,score:r.composite_score,priority:r.priority,
    }));
    S.oppFinancial=fin||[];
    // Restore plan selection after analysis-triggered reload
    const _savedPlan=sessionStorage.getItem('nba_filterPlan');
    const _savedKey=sessionStorage.getItem('nba_analysisKey');
    if(_savedPlan){S.filterPlan=_savedPlan;sessionStorage.removeItem('nba_filterPlan');}
    if(_savedKey){S._highlightCardKey=_savedKey;sessionStorage.removeItem('nba_analysisKey');}
    // Tab is restored AFTER loadLatestSession (see init chain at bottom)
    S.opportunities=S.opportunities.map(r=>({...r,
      gaps:[],// loaded on-demand in confirmOpp
    }));
    // Build member & channel maps (joined rows from /members)
    S.memberMap=Object.fromEntries(members.map(m=>[m.member_key,m]));
    S.chanMap=Object.fromEntries(members.map(m=>[m.member_key,{
      email_allowed:m.email_allowed,sms_allowed:m.sms_allowed,
      call_allowed:m.call_allowed,preferred_channel:m.preferred_channel,
      do_not_contact_flag:m.do_not_contact_flag,
    }]));
    S.apiConnected=true;S.loading=false;S.error=null;
  }catch(e){
    S.loading=false;
    S.error='Cannot reach API. Please wait a moment and refresh — the server may be starting up.';
    S.apiConnected=false;
  }
  renderApiStatus();render();
}

/* ── Load Latest Session ───────────────────────────────────────────── */
async function loadLatestSession(){
  try{
    const data=await apiGet('/session/latest');
    if(!data.run_id)return;
    S.runId=data.run_id;S.status='complete';S.phase=5;
    S.traceRows=data.trace||[];
    S.outreachRows=data.outreach||[];
    S.decisionRows=data.decisions||[];
    S.sendState={};S.msgPreviews={};
    const dec=data.decisions||[];
    const otr=data.outreach||[];
    for(const r of otr){
      if(r.generated_message)S.msgPreviews[r.contact_id]=r.generated_message;
      if(r.status==='SENT')S.sendState[r.contact_id]={sent:true,scheduled:false,msg:r.generated_message};
      else if(r.status==='SCHEDULED')S.sendState[r.contact_id]={sent:true,scheduled:true,msg:r.generated_message};
      else if(r.status==='FAILED')S.sendState[r.contact_id]={failed:true,msg:r.generated_message,error:r.error_reason};
      else if(r.status==='SUPPRESSED')S.sendState[r.contact_id]={suppressed:true,reason:r.error_reason||'Do Not Contact'};
    }
    const avgLift=dec.length?Math.round(dec.reduce((s,r)=>s+(+(r.expected_gap_closure_lift)||0),0)/dec.length*100):0;
    const totalCost=otr.reduce((s,r)=>s+incCost(r.incentive_offered),0);
    S.kpis={gaps:[...new Set(dec.map(d=>d.member_gap_key))].length,contacts:otr.length,lift:`+${avgLift}%`,cost:`$${totalCost}`};
    S.agentSt={opp:'done',seg:'done',camp:'done',out:'done'};
    const find=step=>(S.traceRows.find(t=>t.step===step)||{}).output_summary||'';
    S.agentSum={opp:find('OPPORTUNITY_SELECTED'),seg:find('COHORTS_ASSIGNED'),
                camp:find('CAMPAIGN_CREATED'),out:find('OUTREACH_PLAN_CREATED')};
    S.selCohorts=[];S.selOpp=null;// not needed for phase 5 display
    S.tab='run';render();
  }catch(e){/* no previous session or API offline */}
}

/* ── Session Start ─────────────────────────────────────────────────── */
async function startSession(preIdx=null){
  const mk=preIdx!==null?S.opportunities[preIdx]?.measure_key:null;
  const pk=preIdx!==null?S.opportunities[preIdx]?.plan_key:null;
  try{
    const resp=await apiPost('/session/start',{measure_key:mk,plan_key:pk});
    S.runId=resp.run_id;
  }catch(e){
    const n=new Date();
    S.runId=`RUN_${n.getFullYear()}${pad2(n.getMonth()+1)}${pad2(n.getDate())}_${pad2(n.getHours())}${pad2(n.getMinutes())}${pad2(n.getSeconds())}`;
  }
  S.phase=1;S.status='active';
  S.selectedOppIdx=preIdx;S.selOpp=null;
  S.inScopeGaps=[];S.cohorts=[];S.selCohorts=[];
  S.campOptions=[];S.campIdx=null;S.campaign=null;S.campaignId=null;
  S.step4Loading=false;
  S.outreachRows=[];S.decisionRows=[];S.traceRows=[];S.lastTraceSeen=0;
  S.agentSt={opp:'active',seg:'idle',camp:'idle',out:'idle'};
  S.agentSum={opp:'Scanning measures × plans…',seg:'',camp:'',out:''};
  S.kpis={gaps:'—',contacts:'—',lift:'—',cost:'—'};
  S.autoStatus=null;S.autoAborted=false;
  S.gapsBefore=S.opportunities.reduce((s,o)=>s+o.openCount,0);
  S.gapsAfter=null;
  if(S.pollTimer){clearInterval(S.pollTimer);S.pollTimer=null;}
  render();
}

function resetSession(){
  S.phase=0;S.status='idle';S.runId=null;
  S.agentSt={opp:'idle',seg:'idle',camp:'idle',out:'idle'};
  S.agentSum={opp:'',seg:'',camp:'',out:''};
  S.kpis={gaps:'—',contacts:'—',lift:'—',cost:'—'};
  if(S.pollTimer){clearInterval(S.pollTimer);S.pollTimer=null;}
  render();
}

/* ── Back Navigation ───────────────────────────────────────────────── */
async function goBack(toPhase){
  // Fire-and-forget DELETE to clean any partial DB state (safe even if nothing written yet)
  if(S.runId)apiPost(`/session/${S.runId}/delete-partial`,{}).catch(()=>{});
  // Trim in-memory trace rows back to the target phase boundary
  const keepSteps={1:['OPPORTUNITY_SELECTED'],2:['OPPORTUNITY_SELECTED','COHORTS_ASSIGNED'],3:['OPPORTUNITY_SELECTED','COHORTS_ASSIGNED','CAMPAIGN_CREATED','MANUAL_OVERRIDE']};
  if(keepSteps[toPhase])S.traceRows=S.traceRows.filter(r=>keepSteps[toPhase].includes(r.step));
  if(toPhase===1){
    S.phase=1;
    S.agentSt={opp:'active',seg:'idle',camp:'idle',out:'idle'};
    S.agentSum={opp:`Scanning measures × plans…`,seg:'',camp:'',out:''};
    S.cohorts=[];S.selCohorts=[];S.cohortSelPending=null;
    S.campOptions=[];S.campIdx=null;S.campaign=null;S.campaignId=null;S.campEdits={};
    S.outreachRows=[];S.decisionRows=[];S.step4Loading=false;
    S.kpis={gaps:'—',contacts:'—',lift:'—',cost:'—'};
    S.traceRows=[];
  } else if(toPhase===2){
    S.phase=2;
    S.agentSt.seg='active';S.agentSt.camp='idle';S.agentSt.out='idle';
    S.agentSum.camp='';S.agentSum.out='';
    S.campOptions=[];S.campIdx=null;S.campaign=null;S.campaignId=null;S.campEdits={};
    S.outreachRows=[];S.decisionRows=[];S.step4Loading=false;
    S.cohortSelPending=null;
    // Restore kpis.gaps from inScopeGaps
    S.kpis={gaps:S.inScopeGaps.length,contacts:'—',lift:'—',cost:'—'};
  } else if(toPhase===3){
    S.phase=3;
    S.agentSt.camp='active';S.agentSt.out='idle';
    S.agentSum.out='';
    S.outreachRows=[];S.decisionRows=[];S.step4Loading=false;
    S.kpis={...S.kpis,contacts:'—',lift:'—',cost:'—'};
  }
  render();
}

/* ── Phase Confirmations ───────────────────────────────────────────── */
// Fire AI session loop phase silently in the background (non-blocking)
function _triggerAiLoop(mode){
  if(!S.runId||!S.selOpp)return;
  const mk=S.selOpp.measure_key||S.selOpp.measure?.measure_key;
  const pk=S.selOpp.plan_key||S.selOpp.plan?.plan_key;
  if(!mk||!pk)return;
  fetch(`${API}/session/start-loop`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({run_id:S.runId,measure_key:mk,plan_key:pk,mode})
  }).catch(()=>{}); // silent — 503 if no API key is fine
}

async function confirmOpp(){
  const o=S.opportunities[S.selectedOppIdx];
  try{o.gaps=await apiGet(`/gaps/${o.measure_key}/${o.plan_key}`);}
  catch(e){o.gaps=[];}
  S.selOpp=o;
  S.inScopeGaps=o.gaps.filter(g=>String(g.is_suppressed).toLowerCase()!=='true');
  // Patch memberMap/chanMap from gap rows (gaps now include joined member+channel fields)
  for(const g of S.inScopeGaps){
    if(g.language_preference!==undefined){
      S.memberMap[g.member_key]={...S.memberMap[g.member_key],...g};
      S.chanMap[g.member_key]={
        email_allowed:g.email_allowed,sms_allowed:g.sms_allowed,
        call_allowed:g.call_allowed,preferred_channel:g.preferred_channel,
        do_not_contact_flag:g.do_not_contact_flag,
      };
    }
  }
  S.cohorts=generateCohorts(S.inScopeGaps,o.measure.measure_code||'');
  S.kpis.gaps=S.inScopeGaps.length;
  S.agentSt.opp='done';
  S.agentSum.opp=`${o.measure.measure_code} × ${o.plan.plan_name} — ${S.inScopeGaps.length} gaps in scope`;
  S.traceRows.push({nba_run_id:S.runId,timestamp:nowIso(),agent:'Opportunity',step:'OPPORTUNITY_SELECTED',
    input_summary:`${S.opportunities.length} measure × plan combos scanned`,
    output_summary:`${o.measure.measure_code} × ${o.plan.plan_name} selected; ${S.inScopeGaps.length} addressable gaps; star_weight=${o.starWeight}`,
    affected_population_count:S.inScopeGaps.length});
  S.agentSt.seg='active';S.agentSum.seg=`Segmenting ${S.inScopeGaps.length} members…`;
  S.phase=2;render();
  _triggerAiLoop('cohort');
  if(S.autoMode)autoModeRun();
}

function confirmCohorts(sel){
  if(sel==='all')S.selCohorts=[...S.cohorts];
  else if(sel==='c1c2')S.selCohorts=S.cohorts.slice(0,2).filter(Boolean);
  else S.selCohorts=[S.cohorts[0]].filter(Boolean);
  S.cohortSelPending=null;
  S.campOptions=generateCampaignOptions();
  const tot=S.selCohorts.reduce((s,c)=>s+c.gaps.length,0);
  S.agentSt.seg='done';
  S.agentSum.seg=`${S.selCohorts.length} cohort${S.selCohorts.length>1?'s':''} · ${tot} members`;
  S.traceRows.push({nba_run_id:S.runId,timestamp:nowIso(),agent:'Segmentation',step:'COHORTS_ASSIGNED',
    input_summary:`${S.inScopeGaps.length} in-scope gaps`,
    output_summary:S.selCohorts.map(c=>`${c.id}(${c.gaps.length})`).join('; '),
    affected_population_count:tot});
  S.agentSt.camp='active';S.agentSum.camp='Designing campaign options…';
  S.phase=3;render();
  _triggerAiLoop('campaign');
}

function confirmCampaign(){
  S.campaign=S.campOptions[S.campIdx];
  S.campaignId=`CMP_${S.runId.substring(4)}_01`;
  // Apply manual edits to campaign fields
  const e=S.campEdits;
  if(Object.keys(e).length>0){
    const fieldLabels={primaryCh:'Primary Channel',fallbackCh:'Fallback Channel',c1Inc:'T1 Incentive',c2Inc:'T2 Incentive',freqPlan:'Frequency Plan',theme:'Message Theme'};
    const overrideNotes=Object.entries(e).map(([f,v])=>`${fieldLabels[f]||f} overridden to "${v}"`).join('; ');
    // Write override trace row before campaign created
    S.traceRows.push({nba_run_id:S.runId,timestamp:nowIso(),agent:'Campaign',step:'MANUAL_OVERRIDE',
      input_summary:`User edited ${Object.keys(e).length} field(s)`,
      output_summary:`manually overridden by user — ${overrideNotes}`,
      affected_population_count:S.selCohorts.reduce((s,c)=>s+c.gaps.length,0)});
    // Patch campaign object with edits
    if(e.c1Inc)S.campaign={...S.campaign,c1Inc:e.c1Inc,incSum:S.campaign.incSum.replace(/T1:[^;]+/,`T1:${incLabel(e.c1Inc)}`)};
    if(e.c2Inc)S.campaign={...S.campaign,c2Inc:e.c2Inc,incSum:S.campaign.incSum.replace(/T2:[^;]+/,`T2:${incLabel(e.c2Inc)}`)};
    if(e.freqPlan)S.campaign={...S.campaign,freqSum:e.freqPlan};
    if(e.primaryCh||e.fallbackCh){
      const pch=e.primaryCh||S.campaign.c1Ch.split(' ')[0];
      const fbch=e.fallbackCh||'';
      S.campaign={...S.campaign,channelSum:`T1:${pch}${fbch?'+'+fbch:''} (edited)${S.campaign.c2Ch&&S.campaign.c2Ch!=='—'?`; T2:${S.campaign.c2Ch}`:''}${S.campaign.c3Ch&&S.campaign.c3Ch!=='—'?`; T3:${S.campaign.c3Ch}`:''}` };
    }
  }
  S.agentSt.camp='done';S.agentSum.camp=S.campaign.name+(Object.keys(e).length?` (${Object.keys(e).length} fields customised)`:'');
  S.traceRows.push({nba_run_id:S.runId,timestamp:nowIso(),agent:'Campaign',step:'CAMPAIGN_CREATED',
    input_summary:`${S.selCohorts.length} cohorts targeted`,
    output_summary:`${S.campaignId}; ${S.campaign.channelSum}; ${S.campaign.incSum}`,
    affected_population_count:S.selCohorts.reduce((s,c)=>s+c.gaps.length,0)});
  S.agentSt.out='active';S.agentSum.out='Generating outreach plan…';
  S.phase=4;S.step4Loading=true;S.campEdits={};render();
  _triggerAiLoop('outreach');
  setTimeout(()=>{S.step4Loading=false;try{buildOutputs();}catch(e){console.warn('buildOutputs err:',e);}finally{if(S.agentSt.out!=='done')S.agentSt.out='done';}render();},1600);
}

async function preloadPreviews(){

async function autoSendAll(){
  const contacts=[...S.outreachRows];
  S.deliveryInProgress=true;
  S.deliveryProgress={total:contacts.length,sent:0,failed:0,scheduled:0,suppressed:0,overridden:0,results:[]};
  renderRight();
  for(const c of contacts){
    S.sendState[c.contact_id]={loading:true};renderRight();
    try{
      const res=await apiPost(`/send/message/${c.contact_id}`,{});
      const isScheduled=res.status==='SCHEDULED';
      const isSuppressed=res.status==='SUPPRESSED';
      if(isSuppressed){
        S.sendState[c.contact_id]={suppressed:true,reason:res.error||'Do Not Contact'};
        S.deliveryProgress.suppressed++;
      }else if(res.success){
        S.sendState[c.contact_id]={sent:true,scheduled:isScheduled,msg:res.message_text,override:res.override_note||null};
        if(res.message_text)S.msgPreviews[c.contact_id]=res.message_text;
        if(isScheduled)S.deliveryProgress.scheduled++;
        else S.deliveryProgress.sent++;
        if(res.override_note)S.deliveryProgress.overridden++;
      }else{
        S.sendState[c.contact_id]={failed:true,msg:res.message_text,error:res.error||'Delivery failed'};
        S.deliveryProgress.failed++;
      }
    }catch(err){
      S.sendState[c.contact_id]={failed:true,error:String(err)};
      S.deliveryProgress.failed++;
    }
    S.deliveryProgress.results.push({contact_id:c.contact_id,...S.sendState[c.contact_id]});
    renderRight();
  }
  S.deliveryInProgress=false;
  // Add delivery trace row
  const dp=S.deliveryProgress;
  S.traceRows.push({nba_run_id:S.runId,timestamp:nowIso(),agent:'Outreach',step:'MESSAGES_DELIVERED',
    input_summary:`${dp.total} contacts`,
    output_summary:`${dp.sent} WhatsApp sent, ${dp.scheduled} calls scheduled, ${dp.failed} failed`,
    affected_population_count:dp.sent+dp.scheduled});
  try{await apiPost(`/session/${S.runId}/trace`,S.traceRows[S.traceRows.length-1]);}catch(e){}
  renderRight();
}

let _finalizing=false;
async function finalizeSession(){
  if(_finalizing)return; // prevent double-submit
  _finalizing=true;
  try{
    const tot=S.selCohorts.reduce((s,c)=>s+c.gaps.length,0);
    const ts=nowIso();
    S.traceRows.push(
      {nba_run_id:S.runId,timestamp:ts,agent:'Outreach',step:'OUTREACH_PLAN_CREATED',
        input_summary:`1 campaign × ${S.selCohorts.length} cohorts × ${tot} gaps`,
        output_summary:`${S.outreachRows.length} planned contacts`,affected_population_count:tot},
      {nba_run_id:S.runId,timestamp:ts,agent:'Outreach',step:'RUN_SUMMARY',
        input_summary:`${S.selOpp.measure.measure_code} × ${S.selOpp.plan.plan_name} complete`,
        output_summary:`${tot} gaps targeted; ${S.outreachRows.length} contacts planned; ${S.kpis.lift} avg lift`,
        affected_population_count:tot}
    );
    const campRow={
      campaign_id:S.campaignId,nba_run_id:S.runId,
      measure_key:S.selOpp.measure_key,plan_key:S.selOpp.plan_key,
      campaign_name:S.campaign.name,
      target_cohort_ids:S.selCohorts.map(c=>c.id).join(';'),
      channel_strategy:S.campaign.channelSum,frequency_plan:S.campaign.freqSum,
      message_template_id:'TMPL_'+S.selOpp.measure.measure_code+'_PLAIN_V1',
      incentive_strategy:S.campaign.incSum,created_timestamp:ts,
    };
    try{
      // Bulk saves — single POST per table instead of one-per-row to avoid overwhelming Render
      await Promise.all([
        apiPost(`/session/${S.runId}/decisions`, S.decisionRows),
        apiPost(`/session/${S.runId}/campaign`, campRow),
      ]);
      await apiPost(`/session/${S.runId}/outreach`, S.outreachRows);
      await Promise.all(S.traceRows.map(r=>apiPost(`/session/${S.runId}/trace`,r)));
      // Auto-send all outreach immediately on confirm — no manual "Send All" needed
      S.sendAllInProgress=true;
      try{
        const res=await apiPost(`/send/all/${S.runId}`,{});
        const results=res.results||[];
        for(const r of results){
          if(r.status==='SUPPRESSED'){
            S.sendState[r.contact_id]={suppressed:true,reason:r.error||'Do Not Contact'};
          }else if(r.success){
            S.sendState[r.contact_id]={sent:true,scheduled:r.status==='SCHEDULED',msg:r.message_text};
          }else{
            S.sendState[r.contact_id]={failed:true,msg:r.message_text,error:r.error||'Failed'};
          }
        }
      }catch(sendErr){console.warn('Auto send-all error (non-fatal):',sendErr);}
      S.sendAllInProgress=false;
      // Track this opp as launched so Opportunities tab shows "In Evaluation"
      if(S.selOpp){
        const _lm=S.selOpp.measure_key||S.selOpp.measure_code||'';
        const _lp=S.selOpp.plan_key||S.selOpp.plan_id||'';
        if(_lm&&_lp){if(!S.launchedOpps)S.launchedOpps=new Set();S.launchedOpps.add(_lm+'_'+_lp);}
      }
    }catch(e){console.warn('API write error (non-fatal):',e);}
  }finally{
    // ALWAYS transition to phase 5 even if API writes timed out or threw
    S.phase=5;S.status='complete';S.autoStatus=null;render();
    _finalizing=false;
  }
  startPolling();
  refreshOpportunities();
  preloadPreviews(); // fire-and-forget
  // Navigate to eval tab immediately — don't block on eval computation
  S.tab='eval';render();
  // Background: schedule windows + trigger initial eval + reload eval data
  (async()=>{
    try{
      const sr=await _fetchWithTimeout(`${API}/evaluate/schedule/${S.runId}`,{method:'POST'},8000);
      if(sr.ok){
        const sd=await sr.json();
        const dates=sd.schedule.map(s=>`Day ${s.evaluation_window}: ${s.scheduled_date}`).join(' · ');
        S.evalScheduledMsg=`Evaluation scheduled — this campaign will be automatically evaluated on ${dates}`;
        renderEval();
      }
    }catch(e){S.evalScheduledMsg='';}
    try{ await triggerEval(S.runId); }catch(e){ console.warn('Initial eval trigger failed:',e); }
    await loadEvalData();
  })();
}

/* ── Polling ───────────────────────────────────────────────────────── */
function startPolling(){
  if(S.pollTimer)clearInterval(S.pollTimer);
  S.pollTimer=setInterval(async()=>{
    if(!S.runId||S.status==='idle'){clearInterval(S.pollTimer);return;}
    try{
      const data=await apiGet(`/session/${S.runId}/status`);
      if(data.outreach?.length)S.outreachRows=data.outreach;
      if(data.trace?.length)S.traceRows=data.trace;
      renderRight();
    }catch(e){}
  },5000);
}

/* ── Auto-mode runner ──────────────────────────────────────────────── */
async function autoModeRun(){
  S.autoAborted=false;
  const delay=ms=>new Promise(r=>setTimeout(r,ms));

  // Phase 2 — Segmentation
  S.autoStatus='Segmentation Agent running — building member cohorts…';render();
  await delay(2000);if(S.autoAborted)return;
  confirmCohorts('both');

  // Phase 3 — Campaign
  S.autoStatus=`Campaign Design Agent running — selecting strategy for ${S.selCohorts.length} cohort(s)…`;render();
  await delay(2000);if(S.autoAborted)return;
  S.campIdx=0;confirmCampaign();

  // Phase 4 — wait for buildOutputs (1600 ms setTimeout inside confirmCampaign)
  S.autoStatus='Outreach Agent running — generating per-member contact plan…';render();
  await delay(3800);if(S.autoAborted)return;

  S.autoStatus='Finalising session — writing to database…';render();
  await finalizeSession();
  S.autoStatus=null;
}

async function handleDatasourceFiles(fileList){
  if(!fileList||!fileList.length)return;
  const statusEl=document.getElementById('ds-status');
  if(!statusEl)return;

  const names=[...fileList].map(f=>f.name).join(', ');
  statusEl.innerHTML=`<div style="display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--g300);margin-bottom:.75rem"><div class="loading-spinner" style="width:13px;height:13px;border-width:2px;flex-shrink:0"></div>Uploading ${names}…</div>`;

  const form=new FormData();
  for(const f of fileList) form.append('files',f);

  let runId;
  try{
    const resp=await fetch(`${API}/datasource/upload`,{method:'POST',body:form});
    if(!resp.ok){const e=await resp.json();throw new Error(e.detail||'Upload failed');}
    const data=await resp.json();
    runId=data.run_id;
    statusEl.innerHTML=`<div style="font-size:.82rem;color:var(--g300);margin-bottom:.5rem">Files received. Claude AI is analyzing your data…<br><span style="color:var(--g400);font-size:.75rem">Run ID: ${runId}</span></div>`;
  }catch(e){
    statusEl.innerHTML=`<div style="color:#f87171;font-size:.82rem">Upload failed: ${e.message}</div>`;
    return;
  }

  // Poll datasource status
  let attempts=0;
  const poll=setInterval(async()=>{
    attempts++;
    try{
      const st=await apiGet(`/datasource/status/${runId}`);
      if(st.phase==='complete'){
        clearInterval(poll);
        const ingested=(st.results||[]).filter(r=>r.status==='ok');
        const failed=(st.results||[]).filter(r=>r.status==='error');
        const tops=(st.analysis?.top_opportunities||[]).slice(0,3);

        let html=`<div style="background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.25);border-radius:8px;padding:.75rem 1rem;margin-bottom:.6rem">
          <div style="font-weight:600;font-size:.85rem;color:#4ade80;margin-bottom:.35rem">Data loaded successfully</div>
          ${ingested.map(r=>r.table?`<div style="font-size:.77rem;color:var(--g300)">${r.filename} → <strong>${r.table}</strong> (${r.rows_loaded} rows)</div>`:
            `<div style="font-size:.77rem;color:var(--g300)">${r.filename} → ${JSON.stringify(r.tables_loaded)}</div>`).join('')}
          ${failed.map(r=>`<div style="font-size:.77rem;color:#f87171">${r.filename}: ${r.message}</div>`).join('')}
        </div>`;

        if(tops.length){
          html+=`<div style="font-size:.78rem;font-weight:600;color:#a5b4fc;margin-bottom:.4rem">AI Top Opportunities from your data:</div>`;
          tops.forEach((o,i)=>{
            html+=`<div style="background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.2);border-radius:7px;padding:.55rem .9rem;margin-bottom:.35rem">
              <div style="font-weight:600;font-size:.82rem">#${i+1} ${o.measure_key} × ${o.plan_key}${o.ai_analysis?` — Every $1 returns $${Math.round((o.net_return||0)/Math.max(o.total_outreach_cost||1,1)).toLocaleString()} net`:' — AI analysis pending'} | CMS Bonus ${_fmtN(o.cms_bonus||o.cms_bonus_expected||0)}</div>
              <div style="font-size:.75rem;color:var(--g300);margin-top:.2rem">${(o.claude_reasoning||'').substring(0,120)}</div>
            </div>`;
          });
        }else if(st.analysis?.status==='unavailable'){
          html+=`<div style="font-size:.78rem;color:var(--g400)">Data loaded. Set ANTHROPIC_API_KEY in .env to enable AI analysis.</div>`;
        }

        html+=`<button onclick="S.oppConnectModal=false;refreshOpportunities().then(renderOpp)" class="btn-primary" style="width:100%;margin-top:.75rem;font-size:.82rem">View Updated Opportunities</button>`;
        statusEl.innerHTML=html;

        // Refresh opportunities data in background
        refreshOpportunities();
      }else if(st.phase==='failed'){
        clearInterval(poll);
        const errs=(st.results||[]).filter(r=>r.status==='error').map(r=>r.message).join('; ');
        statusEl.innerHTML=`<div style="color:#f87171;font-size:.82rem">Ingestion failed: ${errs}</div>`;
      }else if(attempts>60){
        clearInterval(poll);
        statusEl.innerHTML=`<div style="color:var(--g400);font-size:.82rem">Taking longer than expected — check API logs.</div>`;
      }else{
        const phaseLabel={queued:'Queued…',ingesting:'Loading your data…',analyzing:'Claude AI analyzing opportunities…'}[st.phase]||st.phase;
        statusEl.innerHTML=`<div style="display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--g300)"><div class="loading-spinner" style="width:13px;height:13px;border-width:2px;flex-shrink:0"></div>${phaseLabel}</div>`;
      }
    }catch(e){}
  },3000);
}

      starWeight:r.star_weight,openCount:r.open_gap_count,avgProp:r.avg_propensity,

async function loadSessionById(runId){
  S.historyOpen=false;
  try{
    const data=await apiGet(`/session/${runId}/status`);
    S.runId=runId;S.status='complete';S.phase=5;
    S.traceRows=data.trace||[];S.outreachRows=data.outreach||[];S.decisionRows=data.decisions||[];
    S.sendState={};S.msgPreviews={};
    const dec=data.decisions||[];const otr=data.outreach||[];
    for(const r of otr){
      if(r.generated_message)S.msgPreviews[r.contact_id]=r.generated_message;
      if(r.status==='SENT')S.sendState[r.contact_id]={sent:true,scheduled:false,msg:r.generated_message};
      else if(r.status==='SCHEDULED')S.sendState[r.contact_id]={sent:true,scheduled:true,msg:r.generated_message};
      else if(r.status==='FAILED')S.sendState[r.contact_id]={failed:true,msg:r.generated_message,error:r.error_reason};
      else if(r.status==='SUPPRESSED')S.sendState[r.contact_id]={suppressed:true,reason:r.error_reason||'Do Not Contact'};
    }
    const avgLift=dec.length?Math.round(dec.reduce((s,r)=>s+(+(r.expected_gap_closure_lift)||0),0)/dec.length*100):0;
    const totalCost=otr.reduce((s,r)=>s+incCost(r.incentive_offered),0);
    S.kpis={gaps:[...new Set(dec.map(d=>d.member_gap_key))].length,contacts:otr.length,lift:`+${avgLift}%`,cost:`$${totalCost}`};
    S.agentSt={opp:'done',seg:'done',camp:'done',out:'done'};
    const find=step=>(S.traceRows.find(t=>t.step===step)||{}).output_summary||'';
    S.agentSum={opp:find('OPPORTUNITY_SELECTED'),seg:find('COHORTS_ASSIGNED'),camp:find('CAMPAIGN_CREATED'),out:find('OUTREACH_PLAN_CREATED')};
    S.selCohorts=[];S.selOpp=null;S.gapsAfter=null;S.autoStatus=null;
    S.tab='run';render();
  }catch(e){}
}
