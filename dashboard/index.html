/* ── Data Builders ─────────────────────────────────────────────────── */
function buildOutputs(){
  if(!S.selOpp||!S.selCohorts.length){
    console.warn('buildOutputs: selOpp or selCohorts missing',{selOpp:S.selOpp,cohorts:S.selCohorts.length});
    return;
  }
  const today=new Date().toISOString().split('T')[0];
  const ctr=S.runId.split('_')[2];
  const mCode=S.selOpp.measure.measure_code;
  const allGaps=S.selCohorts.flatMap(c=>c.gaps);
  const days=allGaps.map(g=>+(g.days_open)||0);
  const maxD=Math.max(...days)||1,minD=Math.min(...days)||0;
  let cn=1;const oRows=[],dRows=[];
  for(const cohort of S.selCohorts){
    for(const gap of cohort.gaps){
      const mem=S.memberMap[gap.member_key]||{};
      const chan=S.chanMap[gap.member_key]||{};
      if(chan.do_not_contact_flag==='true')continue;
      const lang=mem.language_preference||'EN';
      const tpl=tmpl(mCode,lang);
      const inc=cohort.incentive;
      // Channel & timing by tier
      let ch1,contactDay;
      if(cohort.id==='C1_DIGITAL_HIGH_PROP'){
        ch1=chan.email_allowed==='true'?'EMAIL':chan.sms_allowed==='true'?'SMS':'CALL';
        contactDay=1;
      }else if(cohort.id==='C2_MID_PROPENSITY'){
        ch1=chan.sms_allowed==='true'?'SMS':chan.email_allowed==='true'?'EMAIL':'CALL';
        contactDay=3;
      }else{// C3 high-touch
        const pref=chan.preferred_channel||'';
        ch1=pref==='CALL'&&chan.call_allowed==='true'?'CALL':
            chan.sms_allowed==='true'?'SMS':chan.email_allowed==='true'?'EMAIL':'CALL';
        contactDay=10;
      }
      oRows.push({nba_run_id:S.runId,contact_id:`CT_${ctr}_${String(cn++).padStart(3,'0')}`,
        member_gap_key:gap.member_gap_key,campaign_id:S.campaignId,channel:ch1,
        planned_datetime:addDays(today,contactDay)+'T09:00:00',message_template_id:tpl,
        incentive_offered:inc,status:'PLANNED',created_timestamp:today});
      // Follow-up touches
      if(cohort.id==='C1_DIGITAL_HIGH_PROP'){
        const ch2=S.campaign.id==='OPT1'?
          (chan.sms_allowed==='true'&&ch1!=='SMS'?'SMS':null):
          (chan.call_allowed==='true'?'CALL':null);
        if(ch2)oRows.push({nba_run_id:S.runId,contact_id:`CT_${ctr}_${String(cn++).padStart(3,'0')}`,
          member_gap_key:gap.member_gap_key,campaign_id:S.campaignId,channel:ch2,
          planned_datetime:addDays(today,S.campaign.id==='OPT1'?7:14)+'T09:00:00',
          message_template_id:tpl,incentive_offered:inc,status:'PLANNED',created_timestamp:today});
      }else if(S.campaign.id==='OPT2'){
        // OPT2: second touch for T2 (call d10) and T3 (SMS d14)
        const ch2=cohort.id==='C2_MID_PROPENSITY'?
          (chan.call_allowed==='true'?'CALL':(chan.sms_allowed==='true'&&ch1!=='SMS'?'SMS':null)):
          (chan.sms_allowed==='true'&&ch1!=='SMS'?'SMS':null);
        if(ch2)oRows.push({nba_run_id:S.runId,contact_id:`CT_${ctr}_${String(cn++).padStart(3,'0')}`,
          member_gap_key:gap.member_gap_key,campaign_id:S.campaignId,channel:ch2,
          planned_datetime:addDays(today,cohort.id==='C2_MID_PROPENSITY'?10:14)+'T09:00:00',
          message_template_id:tpl,incentive_offered:inc,status:'PLANNED',created_timestamp:today});
      }
      const normD=maxD===minD?0.5:((+(gap.days_open)||0)-minD)/(maxD-minD);
      const sw=gap.gap_status==='Open'?1.0:gap.gap_status==='Partial'?0.6:0.3;
      const ps=Math.round(100*(0.4*normD+0.4*(+(gap.nba_propensity_score)||0)+0.2*sw));
      const prop=+(gap.nba_propensity_score)||0;
      const liftBase=cohort.id==='C1_DIGITAL_HIGH_PROP'?0.22:cohort.id==='C2_MID_PROPENSITY'?0.15:0.08;
      const lift=Math.max(0.05,Math.min(0.30,
        liftBase+(prop-0.5)*0.1+(gap.gap_status==='Borderline'?0.04:0)));
      const codes=[];
      if(prop>=0.70)codes.push('HIGH_PROP');else codes.push('MED_PROP');
      if(mem.digital_literacy_segment==='High')codes.push('DIGITAL_OK');
      if(mem.digital_literacy_segment==='Low')codes.push('LOW_DIGITAL');
      if(mem.socioeconomic_segment==='Low')codes.push('LOW_SES');
      if(lang!=='EN')codes.push('LANG_BARRIER');
      if(chan.email_allowed==='true'&&chan.preferred_channel==='EMAIL')codes.push('EMAIL_PREF');
      if(chan.call_allowed!=='true')codes.push('PHONE_OPTOUT');
      if(gap.gap_status==='Borderline')codes.push('BORDERLINE');
      if(gap.gap_status==='Partial')codes.push('PARTIAL_GAP');
      if(gap.previous_year_gap_flag==='true')codes.push('PRIOR_YEAR_GAP');
      dRows.push({nba_run_id:S.runId,member_gap_key:gap.member_gap_key,member_key:gap.member_key,
        measure_key:gap.measure_key,measure_code:mCode,plan_key:gap.plan_key,
        measurement_year:gap.measurement_year||'2026',is_in_selected_opportunity:'true',
        cohort_id:cohort.id,cohort_name:cohort.name,cohort_priority_rank:cohort.priority,
        nba_action_type:'OUTREACH_MEMBER',final_channel:ch1,final_incentive:inc,
        priority_score:ps,sla_days_to_contact:contactDay,
        expected_gap_closure_lift:Math.round(lift*100)/100,
        reason_codes:codes.join(';'),
        explanation_text:buildExpl(gap,mem,lang,ch1,inc,cohort),
        decision_timestamp:today});
    }
  }
  S.outreachRows=oRows;S.decisionRows=dRows;
  const totalCost=oRows.reduce((s,r)=>s+incCost(r.incentive_offered),0);
  const avgLift=dRows.length?Math.round(dRows.reduce((s,r)=>s+(+(r.expected_gap_closure_lift)||0),0)/dRows.length*100):0;
  S.kpis={gaps:S.inScopeGaps.length,contacts:oRows.length,lift:`+${avgLift}%`,cost:`$${totalCost}`};
  S.agentSt.out='done';S.agentSum.out=`${oRows.length} contacts planned across ${S.selCohorts.length} cohorts`;
}

function buildExpl(gap,mem,lang,ch,inc,cohort){
  const p=+(gap.nba_propensity_score)||0;
  const pts=[];
  pts.push(p>=0.70?'High-propensity member':'Moderate-propensity member');
  if(mem.digital_literacy_segment==='High')pts.push('digitally engaged');
  if(lang==='ES')pts.push('Spanish-speaking');
  if(lang==='ZH')pts.push('Mandarin-speaking');
  if(mem.socioeconomic_segment==='Low')pts.push('low-SES');
  pts.push(ch.toLowerCase()+' outreach');
  pts.push(incLabel(inc)+' incentive');
  if(gap.gap_status==='Borderline')pts.push('gap nearly closed');
  return pts.join('; ')+'.';
}

/* ── Cohort & Campaign Generators ──────────────────────────────────── */
function generateCohorts(gaps,mCode){
  // Thresholds aligned with Opportunity page: T1 propensity>0.70, T2 0.45-0.70, T3 <0.45
  const c1=[],c2=[],c3=[];
  for(const g of gaps){
    const m=S.memberMap[g.member_key]||{};
    const c=S.chanMap[g.member_key]||{};
    if(c.do_not_contact_flag==='true')continue;
    const prop=(+(g.nba_propensity_score)||0);
    if(prop>=0.70)c1.push(g);
    else if(prop>=0.45)c2.push(g);
    else c3.push(g);
  }
  const cohorts=[];
  if(c1.length){
    const inc='FIT_KIT_MAILER'; // T1 default: FIT Kit Mailer (WhatsApp, lowest cost)
    const avg=c1.reduce((s,g)=>s+(+(g.nba_propensity_score)||0),0)/c1.length;
    cohorts.push({id:'C1_DIGITAL_HIGH_PROP',name:'Tier 1 — High propensity',
      rule:'Propensity ≥ 0.70 · digital-first (Email + SMS) · FIT Kit Mailer',
      gaps:c1,members:c1.map(g=>S.memberMap[g.member_key]).filter(Boolean),
      priority:1,channelFit:'Email + SMS',avgProp:Math.round(avg*100)/100,incentive:inc});
  }
  if(c2.length){
    const inc='GIFTCARD_15'; // T2 default: $15 Gift Card
    const avg=c2.reduce((s,g)=>s+(+(g.nba_propensity_score)||0),0)/c2.length;
    cohorts.push({id:'C2_MID_PROPENSITY',name:'Tier 2 — Mid propensity',
      rule:'Propensity 0.45–0.70 · SMS + modest incentive',
      gaps:c2,members:c2.map(g=>S.memberMap[g.member_key]).filter(Boolean),
      priority:2,channelFit:'SMS + incentive',avgProp:Math.round(avg*100)/100,incentive:inc});
  }
  if(c3.length){
    const inc='GIFTCARD_25'; // T3 default: $25 Gift Card
    const avg=c3.reduce((s,g)=>s+(+(g.nba_propensity_score)||0),0)/c3.length;
    cohorts.push({id:'C3_ACCESS_BARRIER',name:'Tier 3 — High-touch / access-barrier',
      rule:'Propensity < 0.45 · call + voucher · non-English or low digital literacy',
      gaps:c3,members:c3.map(g=>S.memberMap[g.member_key]).filter(Boolean),
      priority:3,channelFit:'Call + voucher',avgProp:Math.round(avg*100)/100,incentive:inc});
  }
  return cohorts;
}

  const c3=S.selCohorts.find(c=>c.id==='C3_ACCESS_BARRIER');

      incSum:incParts.join('; ')},
    {id:'OPT2',name:'Full High-Touch — All Selected Tiers',
      desc:`Adds call follow-up for T1; upgrades all tiers to 2+ touches. Higher reach, higher cost.`,
      c1Ch:c1?'Email d1 → SMS d7 → call d14':'—',
      c2Ch:hasMid?'SMS d1 → call d10':'—',
      c3Ch:hasHigh?`${htChDesc} d7 → SMS d14`:'—',
      c1Inc:'FIT_KIT_MAILER',c2Inc:'GIFTCARD_15',c3Inc:c3inc,
      c1Freq:'Max 3 touches / 21 days',c2Freq:'2 touches / 14 days',c3Freq:'2 touches / 14 days',
      tradeoff:'⚠ Higher cost · better for low-propensity segments · check call opt-outs for T1',
      recommended:false,
      channelSum:[c1?'T1:Email+SMS+Call':null,hasMid?'T2:SMS+Call':null,hasHigh?`T3:${htChDesc}+SMS`:null].filter(Boolean).join('; '),
      freqSum:'T1:3/21d; T2:2/14d; T3:2/14d',
      incSum:[c1?`T1:${incLabel('GIFTCARD_25')}`:null,hasMid?`T2:${incLabel('GIFTCARD_25')}`:null,hasHigh?`T3:${incLabel(c3inc)}`:null].filter(Boolean).join('; ')},

// Per-campaign re-evaluate loading state  { runId: true|false }
const _evalLoadingMap = {};
// Simulation panel open state
let _simPanelOpen = false;

function _apiOffline(e){
  return (e instanceof TypeError && e.message.includes('fetch')) || e.message==='Failed to fetch';
}

async function _fetchWithRetry(url, opts={}){
  const attempt = async () => {
    const res = await fetch(url, opts);
    if(!res.ok){
      let msg='';
      try{msg=await res.text();}catch(_){}
      throw new Error(msg||`HTTP ${res.status}`);
    }
    return res;
  };
  try{ return await attempt(); }
  catch(e){
    if(_apiOffline(e)){
      await new Promise(r=>setTimeout(r,2000));
      try{ return await attempt(); }
      catch(e2){
        if(_apiOffline(e2)) throw new Error('API server offline — please restart the API server and try again');
        throw e2;
      }
    }
    throw e;
  }
}

async function loadEvalData(){
  S.evalLoading=true;S.evalError='';renderEval();
  try{
    const res=await _fetchWithRetry(`${API}/evaluate/all`);
    S.evalData=await res.json();
    const sr=await fetch(`${API}/evaluate/schedule/due`);
    S.evalScheduleDue=sr.ok?(await sr.json()):null;
  }catch(e){
    S.evalError=_apiOffline(e)?'API server offline — please restart the API server':e.message||'Failed to load evaluations';
  }
  S.evalLoading=false;renderEval();
  // Auto-load conversations for all campaigns
  if(S.evalData){
    S.evalData.campaigns.forEach(c=>loadConversations(c.nba_run_id));
    startConvPolling();
    // Populate launchedOpps so Opportunities tab shows "In Evaluation" badges
    // Store both measure_key (M001) and measure_code (BCS) formats for reliable matching
    if(!S.launchedOpps)S.launchedOpps=new Set();
    S.evalData.campaigns.forEach(c=>{
      if(c.measure_key&&c.plan_key)S.launchedOpps.add(c.measure_key+'_'+c.plan_key);
      if(c.measure_code&&c.plan_key)S.launchedOpps.add(c.measure_code+'_'+c.plan_key);
    });
  }
}

async function deleteEval(runId){
  if(!confirm(`Delete evaluation for ${runId}? This removes all eval records for this run.`))return;
  try{
    await fetch(`${API}/evaluate/${runId}`,{method:'DELETE'});
    if(S.evalData) S.evalData.campaigns=S.evalData.campaigns.filter(c=>c.nba_run_id!==runId);
    renderEval();
  }catch(e){console.error('deleteEval failed',e);}
}

// Re-evaluate a specific campaign; updates only that row in evalData
async function triggerEval(runId){
  _evalLoadingMap[runId]=true;renderEval();
  try{
    const res=await _fetchWithRetry(`${API}/evaluate/${runId}`,{method:'POST'});
    const updated=await res.json();
    // patch evalData.campaigns in-place so only this row changes
    if(S.evalData){
      const idx=S.evalData.campaigns.findIndex(c=>c.nba_run_id===runId);
      // Spread existing row first so enriched fields (plan_name, measure_name, etc.) are preserved
      const existing=idx>=0?S.evalData.campaigns[idx]:{};
      const patch={
        ...existing,
        nba_run_id:runId,
        campaign_id:updated.campaign_id,
        evaluation_date:updated.evaluation_date,
        evaluation_window:updated.evaluation_window,
        measure_code:updated.measure_code||existing.measure_code,
        measure_name:updated.measure_name||existing.measure_name,
        plan_key:updated.plan_key||existing.plan_key,
        plan_name:updated.plan_name||existing.plan_name,
        outreach_date:updated.outreach_date||existing.outreach_date,
        star_rating_current:updated.star_rating_current??existing.star_rating_current,
        star_rating_target:updated.star_rating_target??existing.star_rating_target,
        total_members_contacted:updated.total_members_contacted,
        gaps_closed_actual:updated.gaps_closed_actual,
        gaps_closed_expected:updated.gaps_closed_expected,
        actual_closure_rate:updated.actual_closure_rate,
        expected_closure_rate:updated.expected_closure_rate,
        performance_status:updated.performance_status,
        stars_impact_actual:updated.stars_impact_actual,
        stars_impact_projected:updated.stars_impact_projected,
        executive_summary:updated.executive_summary,
      };
      if(idx>=0) S.evalData.campaigns[idx]=patch;
      else S.evalData.campaigns.unshift(patch);
      // recompute portfolio summary
      const cmp=S.evalData.campaigns;
      S.evalData.portfolio_summary={
        total_campaigns_evaluated:cmp.length,
        on_track:cmp.filter(c=>c.performance_status==='On Track').length,
        underperforming:cmp.filter(c=>c.performance_status==='Underperforming').length,
        overperforming:cmp.filter(c=>c.performance_status==='Overperforming').length,
        total_members_contacted:cmp.reduce((s,c)=>s+(c.total_members_contacted||0),0),
        total_gaps_closed:cmp.reduce((s,c)=>s+(c.gaps_closed_actual||0),0),
        stars_impact_actual:Math.round(cmp.reduce((s,c)=>s+(c.stars_impact_actual||0),0)*100)/100,
        stars_impact_projected:Math.round(cmp.reduce((s,c)=>s+(c.stars_impact_projected||0),0)*100)/100,
      };
    }
    // refresh member rows if this run's detail is open
    if(S.evalSelectedRun===runId){
      S.evalMemberRows=updated.member_evaluations||[];
    }
  }catch(e){
    S.evalEvalError={[runId]:_apiOffline(e)?'API server offline — please restart':e.message};
  }
  delete _evalLoadingMap[runId];renderEval();
}

// Record a member outcome and auto-refresh
async function recordOutcome(contactId, outcome, runId){
  try{
    const res=await _fetchWithRetry(`${API}/outcome/${contactId}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({outcome})
    });
    const updated=await res.json();
    // patch campaign row + member rows same as triggerEval
    if(S.evalData){
      const idx=S.evalData.campaigns.findIndex(c=>c.nba_run_id===runId);
      if(idx>=0){
        S.evalData.campaigns[idx].gaps_closed_actual=updated.gaps_closed_actual;
        S.evalData.campaigns[idx].actual_closure_rate=updated.actual_closure_rate;
        S.evalData.campaigns[idx].performance_status=updated.performance_status;
        S.evalData.campaigns[idx].stars_impact_actual=updated.stars_impact_actual;
      }
      const cmp=S.evalData.campaigns;
      S.evalData.portfolio_summary.total_gaps_closed=cmp.reduce((s,c)=>s+(c.gaps_closed_actual||0),0);
      S.evalData.portfolio_summary.stars_impact_actual=Math.round(cmp.reduce((s,c)=>s+(c.stars_impact_actual||0),0)*100)/100;
    }
    S.evalMemberRows=updated.member_evaluations||[];
  }catch(e){alert('Outcome error: '+e.message);}
  renderEval();
}

function statusBadgeEval(s){
  if(!s)return '';
  const map={Overperforming:'badge-green',Underperforming:'badge-red','On Track':'badge-teal'};
  return `<span class="badge ${map[s]||'badge-gray'}">${s}</span>`;
}

function actionBadge(a){
  if(!a||a==='NO_ACTION')return `<span class="badge badge-gray">No Action</span>`;
  const map={ESCALATE_INCENTIVE:'badge-amber',SWITCH_CHANNEL:'badge-amber',CARE_MANAGER_CALL:'badge-red',
             EXTEND_CAMPAIGN:'badge-teal',CLOSE_CAMPAIGN:'badge-green'};
  return `<span class="badge ${map[a]||'badge-gray'}" title="${a}">${a.replace(/_/g,' ')}</span>`;
}

function _outcomePicker(m, runId){
  const OUTCOMES=['Gap Closed','No Response','Wrong Number','Already Completed','Opted Out'];
  const curStatus=m.gap_status_at_evaluation||'Open';
  const isClosed=curStatus==='Closed'||curStatus==='Suppressed';
  const sel = isClosed?'Gap Closed':'';
  return `<select onchange="if(this.value)recordOutcome('${m.contact_id}',this.value,'${runId}')"
    style="font-size:.72rem;padding:.2rem .4rem;border:1px solid var(--g200);border-radius:.25rem;cursor:pointer;background:var(--white);color:var(--g900);max-width:130px">
    <option value="">— set outcome —</option>
    ${OUTCOMES.map(o=>`<option value="${o}" ${sel===o?'selected':''}>${o}</option>`).join('')}
  </select>`;
}

function _outcomeSummary(runId){
  // Count outcomes from evalMemberRows if loaded for this run, else return blank
  if(S.evalSelectedRun!==runId||!S.evalMemberRows.length)return '';
  const closed=S.evalMemberRows.filter(m=>m.gap_status_at_evaluation==='Closed').length;
  const noResp=S.evalMemberRows.filter(m=>m.recommended_action==='NO_ACTION'&&m.gap_status_at_evaluation!=='Closed').length;
  const pending=S.evalMemberRows.length-closed-noResp;
  return `<span style="font-size:.72rem">
    <span style="color:var(--green);font-weight:600">${closed} closed</span>
    <span style="color:var(--g400)"> / </span>
    <span style="color:var(--red)">${noResp} no resp</span>
    <span style="color:var(--g400)"> / </span>
    <span style="color:var(--g600)">${pending} pending</span>
  </span>`;
}

async function toggleMemberEval(runId){
  if(S.evalSelectedRun===runId){S.evalSelectedRun='';S.evalMemberRows=[];renderEval();return;}
  S.evalSelectedRun=runId;S.evalMemberRows=[];renderEval();
  try{
    const res=await _fetchWithRetry(`${API}/evaluate/${runId}/latest`);
    const d=await res.json();
    S.evalMemberRows=d.member_evaluations||[];
  }catch(e){S.evalMemberRows=[];}
  renderEval();
}

async function runScheduled(){
  const btn=document.querySelector('[onclick="runScheduled()"]');
  if(btn){btn.disabled=true;btn.textContent='Running…';}
  try{
    const res=await _fetchWithRetry(`${API}/evaluate/run-scheduled`,{method:'POST'});
    const d=await res.json();
    if(d.triggered===0){
      alert('No evaluations are currently due. All campaigns are up to date.');
    } else {
      const lines=d.results.map(r=>`${r.run_id}: ${r.status}${r.performance_status?' ('+r.performance_status+')':r.error?' — '+r.error:''}`).join('\n');
      alert(`Ran ${d.triggered} evaluation(s):\n${lines}`);
    }
    await loadEvalData();
  }catch(e){
    alert(_apiOffline(e)?'API server offline — please restart the API server and try again':'Run Scheduled failed: '+e.message);
  }
  if(btn){btn.disabled=false;btn.textContent='Run Scheduled';}
}

// Simulation: rate=0.5/0.8/0.2 → fraction closed, rate=-1 → reset
async function runSimulation(rate){
  const selEl=document.getElementById('sim-run-select');
  const runId=selEl?selEl.value:(S.evalData&&S.evalData.campaigns[0]?.nba_run_id||'');
  if(!runId){alert('No run selected');return;}
  const statEl=document.getElementById('sim-status');
  if(statEl)statEl.textContent='Simulating…';

  // fetch member list for this run
  try{
    const res=await _fetchWithRetry(`${API}/evaluate/${runId}/latest`);
    const d=await res.json();
    const members=d.member_evaluations||[];
    if(!members.length){if(statEl)statEl.textContent='No members found for this run';return;}

    // shuffle and assign outcomes
    const shuffled=[...members].sort(()=>Math.random()-0.5);
    const outcomes=[];
    if(rate===-1){
      // reset all to No Response
      shuffled.forEach(m=>outcomes.push({contact_id:m.contact_id,outcome:'No Response'}));
    } else {
      const closeCount=Math.round(shuffled.length*rate);
      shuffled.forEach((m,i)=>outcomes.push({contact_id:m.contact_id,outcome:i<closeCount?'Gap Closed':'No Response'}));
    }

    // send outcomes sequentially (to avoid DB lock)
    let done=0;
    for(const o of outcomes){
      await fetch(`${API}/outcome/${o.contact_id}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({outcome:o.outcome})
      });
      done++;
      if(statEl)statEl.textContent=`${done}/${outcomes.length} recorded…`;
    }

    // final re-eval + refresh
    await triggerEval(runId);
    if(S.evalSelectedRun===runId){
      const r2=await fetch(`${API}/evaluate/${runId}/latest`);
      if(r2.ok){const d2=await r2.json();S.evalMemberRows=d2.member_evaluations||[];}
    }
    if(statEl)statEl.textContent=rate===-1?'Reset complete':`Simulation complete (${Math.round(rate*100)}% closed)`;
    renderEval();
  }catch(e){
    if(statEl)statEl.textContent='Error: '+e.message;
  }
}

const CONV_STATE_BADGE = {
  OUTREACH_SENT: {cls:'badge-gray',  label:'Outreach Sent'},
  EMAIL_SENT:    {cls:'badge-blue',  label:'Email Sent'},
  SMS_SENT:      {cls:'badge-gray',  label:'SMS Sent'},
  CALL_SENT:     {cls:'badge-gray',  label:'Call Sent'},
  AWAITING_DATE: {cls:'badge-amber', label:'Awaiting Date'},
  DATE_CONFIRMED:{cls:'badge-teal',  label:'Date Confirmed'},
  FOLLOW_UP_SENT:{cls:'badge-blue',  label:'Follow-up Sent'},
  COMPLETED:     {cls:'badge-green', label:'Completed'},
  DECLINED:      {cls:'badge-red',   label:'Declined'},
  ESCALATED:     {cls:'badge-red',   label:'Escalated', pulse:true},
};

function convStateBadge(state){
  const cfg=CONV_STATE_BADGE[state]||{cls:'badge-gray',label:state};
  const pulse=cfg.pulse?';animation:pulse 1.5s infinite':'';
  return `<span class="badge ${cfg.cls}" style="white-space:nowrap${pulse}">${cfg.label}</span>`;
}

async function loadConversations(runId){
  if(!runId)return;
  try{
    const res=await fetch(`${API}/conversations/${runId}`);
    if(res.ok){
      const d=await res.json();
      S.convData[runId]=d.conversations||[];
      // seed simulator threads with outreach message if not already started
      (d.conversations||[]).forEach(c=>{
        if(!S.simThreads[c.contact_id]){
          const initMsg=c.outreach_message||`Hi! This is a reminder about your ${c.measure_name||'health screening'} appointment. Are you planning to schedule it soon? Reply YES to let us know or NO if you need more time.`;
          S.simThreads[c.contact_id]=[{role:'system',text:initMsg,ts:(c.created_timestamp||'').replace('T',' ').slice(0,16)}];
        }
      });
    }
  }catch(e){}
  if(S.tab==='eval'){
    const sec=document.getElementById('conv-section');
    if(sec)sec.outerHTML=renderConvSection();
  }
}

function startConvPolling(){
  if(S.convPollTimer)clearInterval(S.convPollTimer);
  S.convPollTimer=setInterval(()=>{
    const campaigns=S.evalData?.campaigns||[];
    campaigns.forEach(c=>loadConversations(c.nba_run_id));
  },30000);
}

function stopConvPolling(){
  if(S.convPollTimer){clearInterval(S.convPollTimer);S.convPollTimer=null;}
}

function _simNow(){
  return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function _simScrollToBottom(contactId){
  const el=document.getElementById(`sim-thread-${contactId}`);
  if(el)el.scrollTop=el.scrollHeight;
}

function _simRerender(){
  const sec=document.getElementById('conv-section');
  if(sec)sec.outerHTML=renderConvSection();
}

async function simSendReply(contactId, replyText, runId){
  if(S.simBusy[contactId])return;
  S.simBusy[contactId]=true;
  if(!S.simThreads[contactId])S.simThreads[contactId]=[];
  S.simThreads[contactId].push({role:'member',text:replyText,ts:_simNow()});
  _simRerender();
  setTimeout(()=>_simScrollToBottom(contactId),50);

  await new Promise(r=>setTimeout(r,900));

  try{
    const res=await fetch(`${API}/conversations/simulate`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contact_id:contactId,reply:replyText})
    });
    if(!res.ok)throw new Error(await res.text());
    const d=await res.json();
    S.simBusy[contactId]=false;
    S.simThreads[contactId].push({role:'system',text:d.reply_msg,ts:_simNow()});
    for(const r2 of Object.keys(S.convData)){
      S.convData[r2]=(S.convData[r2]||[]).map(c=>
        c.contact_id===contactId?{...c,...d.conversation}:c
      );
    }
    if(d.eval_triggered)setTimeout(()=>loadEvalData(),600);
  }catch(e){
    S.simBusy[contactId]=false;
    S.simThreads[contactId].push({role:'system',text:`⚠ Error: ${e.message}`,ts:_simNow()});
  }
  _simRerender();
  setTimeout(()=>_simScrollToBottom(contactId),50);
}

async function simFastForwardFollowup(contactId){
  if(S.simBusy[contactId])return;
  S.simBusy[contactId]=true;
  _simRerender();
  await new Promise(r=>setTimeout(r,700));
  try{
    const res=await fetch(`${API}/conversations/fast-forward-followup`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contact_id:contactId})
    });
    if(!res.ok)throw new Error(await res.text());
    const d=await res.json();
    S.simBusy[contactId]=false;
    S.simThreads[contactId].push({role:'system',text:d.follow_up_msg,ts:_simNow()});
    for(const r2 of Object.keys(S.convData)){
      S.convData[r2]=(S.convData[r2]||[]).map(c=>
        c.contact_id===contactId?{...c,conversation_state:'FOLLOW_UP_SENT',follow_up_sent:1}:c
      );
    }
  }catch(e){
    S.simBusy[contactId]=false;
    S.simThreads[contactId].push({role:'system',text:`⚠ Error: ${e.message}`,ts:_simNow()});
  }
  _simRerender();
  setTimeout(()=>_simScrollToBottom(contactId),50);
}

function toggleSimThread(contactId){
  S.simExpanded[contactId]=!S.simExpanded[contactId];
  _simRerender();
  if(S.simExpanded[contactId])setTimeout(()=>_simScrollToBottom(contactId),60);
}

function renderConvSection(){
  const campaigns=S.evalData?.campaigns||[];
  const allConvs=[];
  campaigns.forEach(c=>{
    (S.convData[c.nba_run_id]||[]).forEach(conv=>allConvs.push({...conv}));
  });

  // Runs sorted latest first (run_id encodes YYYYMMDD_HHMMSS)
  const runIds=[...new Set(campaigns.map(c=>c.nba_run_id))].sort((a,b)=>b.localeCompare(a));
  // Default to most-recent run; reset if stored run no longer exists
  if(S.convSelectedRunId&&!runIds.includes(S.convSelectedRunId))S.convSelectedRunId='';
  const selRun=S.convSelectedRunId||runIds[0]||'';
  const visConvs=selRun?(S.convData[selRun]||[]):allConvs;

  // Sort conversations: outreach date descending (latest first), then by state priority
  const stateOrder=['ESCALATED','FOLLOW_UP_SENT','AWAITING_DATE','DATE_CONFIRMED','OUTREACH_SENT','EMAIL_SENT','COMPLETED','DECLINED'];
  const sorted=[...visConvs].sort((a,b)=>{
    const dt=new Date(b.outreach_sent_at||b.created_timestamp||0)-new Date(a.outreach_sent_at||a.created_timestamp||0);
    if(dt!==0)return dt;
    return stateOrder.indexOf(a.conversation_state)-stateOrder.indexOf(b.conversation_state);
  });

  const summary={
    total:sorted.length,
    completed:sorted.filter(c=>c.conversation_state==='COMPLETED').length,
    awaiting:sorted.filter(c=>c.conversation_state==='AWAITING_DATE').length,
    confirmed:sorted.filter(c=>c.conversation_state==='DATE_CONFIRMED').length,
    escalated:sorted.filter(c=>c.conversation_state==='ESCALATED').length,
  };

  const CH_ICON={EMAIL:'✉️',SMS:'💬',CALL:'📞',WHATSAPP:'🟢'};
  const cards=sorted.length===0
    ?`<div style="padding:1.5rem;text-align:center;color:var(--g400);font-style:italic">
        No outreach conversations yet.<br>
        <span style="font-size:.8rem">Conversations appear here once outreach is sent.</span>
      </div>`
    :sorted.map(c=>{
        const cid=c.contact_id;
        const outreachDate=(c.outreach_sent_at||'').split('T')[0]||'—';
        const expanded=!!S.simExpanded[cid];
        const state=c.conversation_state;
        const done=['COMPLETED','DECLINED','ESCALATED'].includes(state);
        const chKey=(c.channel||'WHATSAPP').toUpperCase();
        const chIcon=CH_ICON[chKey]||'📨';

        let outcomeStrip='';
        if(state==='COMPLETED'){
          const ms=c.created_timestamp&&c.last_updated
            ?Math.max(0,Math.round((new Date(c.last_updated)-new Date(c.created_timestamp))/86400000)):null;
          outcomeStrip=`<div style="display:flex;gap:.75rem;padding:.3rem .9rem .55rem;font-size:.72rem;color:var(--g600)">
            ${c.appointment_date?`<span>📅 <b>${c.appointment_date}</b></span>`:''}
            ${ms!==null?`<span>⏱ ${ms}d outreach→close</span>`:''}
            <span style="color:#25D366;font-weight:600">💬 Closed via WhatsApp</span>
          </div>`;
        }

        const borderColor=state==='COMPLETED'?'#86efac':state==='ESCALATED'?'#fca5a5':'var(--g200)';
        return `<div style="border:1px solid ${borderColor};border-radius:.5rem;overflow:hidden;background:var(--white);margin-bottom:.5rem">
          <div style="display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;flex-wrap:wrap;
                      cursor:pointer;user-select:none" onclick="toggleSimThread('${cid}')">
            <span style="font-family:monospace;font-size:.78rem;color:var(--g700);min-width:7rem">${c.member_key||'—'}</span>
            <span style="font-size:.78rem;color:var(--g600);min-width:4.5rem">${c.measure_name||'—'}</span>
            <span style="font-size:.72rem;color:var(--g400);white-space:nowrap">${chIcon} ${chKey}</span>
            <span style="font-size:.74rem;color:var(--g400)">${outreachDate}</span>
            <span style="margin-left:auto;display:flex;gap:.5rem;align-items:center">
              ${convStateBadge(state)}
              ${c.appointment_date&&!['OUTREACH_SENT','AWAITING_DATE'].includes(state)?`<span style="font-size:.74rem;color:var(--teal)">📅 ${c.appointment_date}</span>`:''}
              ${!done?`<button onclick="event.stopPropagation();toggleSimThread('${cid}')"
                  style="font-size:.72rem;padding:.2rem .55rem;border-radius:.3rem;
                         border:1px solid var(--teal);color:var(--teal);
                         background:transparent;cursor:pointer;white-space:nowrap">
                  ${expanded?'▲ Hide':'💬 Simulate Reply'}
                </button>`:''}
            </span>
          </div>
          ${outcomeStrip}
          ${expanded?`<div style="border-top:1px solid var(--g100)">
            ${_simThread(c)}
            ${_simActionButtons(c)}
          </div>`:''}
        </div>`;
      }).join('');

  return `<div id="conv-section" style="background:var(--white);border:1px solid var(--g200);border-radius:.5rem;padding:1.25rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem">
      <div>
        <h3 style="font-size:.95rem;font-weight:600;color:var(--g900);margin:0 0 .15rem">Outreach Conversations</h3>
        <p style="font-size:.72rem;color:var(--g400);margin:0">Click any row to open the simulator and reply as the member — works for Email, SMS, Call, and WhatsApp.</p>
      </div>
      <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
        ${summary.total>0?`
          <span style="font-size:.78rem;color:var(--green);font-weight:600">${summary.completed} completed</span>
          <span style="font-size:.78rem;color:var(--teal)">${summary.confirmed} confirmed</span>
          <span style="font-size:.78rem;color:var(--amber)">${summary.awaiting} awaiting</span>
          ${summary.escalated?`<span style="font-size:.78rem;color:var(--red);font-weight:600">${summary.escalated} escalated</span>`:''}
        `:''}
        ${runIds.length>1?`<select onchange="S.convSelectedRunId=this.value;renderEval()" style="font-size:.78rem;padding:.25rem .5rem;border:1px solid var(--g200);border-radius:.25rem">
          ${runIds.map(r=>{const cm=campaigns.find(c=>c.nba_run_id===r);const lbl=cm?`${cm.plan_name||r} — ${cm.measure_code||''} (${r.slice(-6)})`:r;return`<option value="${r}" ${r===selRun?'selected':''}>${lbl}</option>`;}).join('')}
        </select>`:''}
        <button class="btn-send" style="font-size:.75rem;padding:.25rem .6rem" onclick="${runIds.map(r=>`loadConversations('${r}')`).join(';')}">↺ Refresh</button>
        <span style="font-size:.72rem;color:var(--g400);font-style:italic">Auto-refreshes every 30s</span>
      </div>
    </div>
    ${cards}
  </div>`;
}

/* ── Render: Opportunities View ────────────────────────────────────── */
function _fmt$(n){if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(0)+'K';return'$'+n.toFixed(0);}
function _pct(r){return(r*100).toFixed(1)+'%';}
// ROI tiers — thresholds calibrated to PMPM-based bonus model
function _roiTier(raw){
  if(raw>=150)return{label:'Exceptional',color:'#34d399',bg:'rgba(52,211,153,.12)',border:'rgba(52,211,153,.35)'};
  if(raw>=50) return{label:'Strong',    color:'var(--teal)',bg:'rgba(241,90,34,.10)',border:'rgba(241,90,34,.30)'};
  if(raw>=15) return{label:'Good',      color:'#60a5fa',bg:'rgba(96,165,250,.10)',border:'rgba(96,165,250,.25)'};
  return       {label:'Marginal',       color:'var(--g400)',bg:'rgba(156,163,175,.08)',border:'rgba(156,163,175,.20)'};
}
function _planCappedBonus(planStarsMap){
  // CMS bonus per plan = min(planStars, 0.30) × members × annual_pmpm × 0.05
  return Object.values(planStarsMap).reduce((s,p)=>
    s + Math.min(p.stars,0.30) * p.members * p.annual_pmpm * 0.05, 0);
}

function _greedyAlloc(opps,budget){
  // PROFIT-FIRST: budget is a ceiling, not a spending target.
  // We only spend on campaigns where AI confirms a positive net return.
  // Loss campaigns are marked 'loss' and their budget is preserved.
  // Unanalyzed campaigns (no AI) are allocated greedily — unknown ROI.
  //
  // Tier logic: T3 excluded — cms_bonus is T1+T2 scoped; T3 adds cost with no modeled return.
  //   'full'    = T1+T2 funded, AI confirms profitable (or no AI yet)
  //   'partial' = T1 only funded (either T1+T2 is a loss but T1 alone profitable, or T1+T2 doesn't fit budget)
  //   'loss'    = AI confirms negative ROI at every tier — budget NOT spent
  //   'unfunded' = budget ran out before this opportunity
  const sorted=[...opps].sort((a,b)=>{
    const aA=!!(a.ai_analysis), bA=!!(b.ai_analysis);
    // Sort by total net return = CMS bonus + medical savings − cost (medical savings is real plan money)
    const netA=(a.total_benefit||(a.cms_bonus||0)+(a.medical_savings||0))-((a.tier1_cost||0)+(a.tier2_cost||0));
    const netB=(b.total_benefit||(b.cms_bonus||0)+(b.medical_savings||0))-((b.tier1_cost||0)+(b.tier2_cost||0));
    if(aA&&bA) return netB-netA;
    if(aA&&!bA) return -1;
    if(!aA&&bA) return 1;
    return (b.star_weight||0)-(a.star_weight||0);
  });
  let rem=budget,totalCost=0;
  const planMeta={};
  for(const o of opps){
    if(!planMeta[o.plan_key]) planMeta[o.plan_key]={members:o.plan_total_members||500,annual_pmpm:(o.annual_pmpm||(o.plan_pmpm_monthly||920)*12)};
  }
  const planStarsUsed={};

  const _capStars=(key,fs)=>{
    const already=planStarsUsed[key]||0;
    const capped=Math.min(fs,Math.max(0,0.30-already));
    planStarsUsed[key]=(already)+capped;
    return capped;
  };

  const funded=sorted.map(o=>{
    const pm=planMeta[o.plan_key];
    const hasAI=!!(o.ai_analysis&&o.cms_bonus>0);
    const t12=(o.tier1_cost||0)+(o.tier2_cost||0);
    const t1cost=o.tier1_cost||0;
    const t1cl=o.tier1_closures||0;
    const t12cl=Math.max((o.tier1_closures||0)+(o.tier2_closures||0),1);

    if(rem<=0) return{...o,funding:'unfunded',funded_cost:0,funded_stars:0,funded_bonus:0,funded_closures:0,funded_medical_savings:0};

    // Total benefit = CMS bonus + medical savings (hoisted so all blocks can reference it)
    const oBenefit=(o.total_benefit||0)||(o.cms_bonus+(o.medical_savings||0));

    // ── Try T1+T2 (full AI-modeled scope) ──
    if(t12>0&&t12<=rem){
      const t12Profitable=!hasAI||(oBenefit>=t12); // only gate if AI has verified the number
      if(t12Profitable){
        const fs=Math.min(t12cl*(o.stars_per_gap||0),o.star_weight*0.15);
        const fsCapped=_capStars(o.plan_key,fs);
        const fb=hasAI?o.cms_bonus:Math.round(fsCapped*pm.members*pm.annual_pmpm*0.05);
        const fms=hasAI?(o.medical_savings||0):0; // funded medical savings = full amount for T1+T2
        rem-=t12;totalCost+=t12;
        return{...o,funding:'full',funded_cost:t12,funded_stars:fsCapped,funded_bonus:fb,funded_closures:t12cl,funded_medical_savings:fms,funding_label:'Tier 1+2'};
      }
      // T1+T2 confirmed loss — cascade to T1 alone
      const fundFrac1=t1cl/t12cl;
      const t1Benefit=hasAI?oBenefit*fundFrac1:0;
      if(t1cost>0&&t1cost<=rem&&t1Benefit>=t1cost){
        const fs1=Math.min(t1cl*(o.stars_per_gap||0),o.star_weight*0.15);
        const fsCapped=_capStars(o.plan_key,fs1);
        const fb=Math.round(o.cms_bonus*fundFrac1);
        const fms=hasAI?Math.round((o.medical_savings||0)*fundFrac1):0; // proportional for T1 only
        rem-=t1cost;totalCost+=t1cost;
        return{...o,funding:'partial',funded_cost:t1cost,funded_stars:fsCapped,funded_bonus:fb,funded_closures:t1cl,funded_medical_savings:fms,funding_label:'Tier 1 only'};
      }
      // All tiers are a confirmed loss — skip, preserve budget
      if(hasAI) return{...o,funding:'loss',funded_cost:0,funded_stars:0,funded_bonus:0,funded_closures:0,funded_medical_savings:0};
      // No AI — unknown ROI, fund T1+T2 anyway (will reassess once AI runs)
      const fs=Math.min(t12cl*(o.stars_per_gap||0),o.star_weight*0.15);
      const fsCapped=_capStars(o.plan_key,fs);
      const fb=Math.round(fsCapped*pm.members*pm.annual_pmpm*0.05);
      rem-=t12;totalCost+=t12;
      return{...o,funding:'full',funded_cost:t12,funded_stars:fsCapped,funded_bonus:fb,funded_closures:t12cl,funded_medical_savings:0,funding_label:'Tier 1+2'};
    }

    // ── T1+T2 doesn't fit budget — try T1 alone ──
    if(t1cost>0&&t1cost<=rem){
      const fundFrac1=t1cl/t12cl;
      const t1Benefit2=hasAI?oBenefit*fundFrac1:null;
      const t1Profitable=!hasAI||(t1Benefit2!==null&&t1Benefit2>=t1cost);
      if(t1Profitable){
        const fs1=Math.min(t1cl*(o.stars_per_gap||0),o.star_weight*0.15);
        const fsCapped=_capStars(o.plan_key,fs1);
        const fb=hasAI?Math.round(o.cms_bonus*fundFrac1):Math.round(fsCapped*pm.members*pm.annual_pmpm*0.05);
        const fms=hasAI?Math.round((o.medical_savings||0)*fundFrac1):0;
        rem-=t1cost;totalCost+=t1cost;
        return{...o,funding:'partial',funded_cost:t1cost,funded_stars:fsCapped,funded_bonus:fb,funded_closures:t1cl,funded_medical_savings:fms,funding_label:'Tier 1 only'};
      }
      if(hasAI) return{...o,funding:'loss',funded_cost:0,funded_stars:0,funded_bonus:0,funded_closures:0,funded_medical_savings:0};
    }

    // Budget exhausted (can't afford even T1)
    return{...o,funding:'unfunded',funded_cost:0,funded_stars:0,funded_bonus:0,funded_closures:0,funded_medical_savings:0};
  });

  const profitable=funded.filter(f=>f.funding==='full'||f.funding==='partial');
  const totalBonus=profitable.reduce((s,o)=>s+(o.funded_bonus||0),0);
  const totalMedSavings=profitable.reduce((s,o)=>s+(o.funded_medical_savings||0),0);
  const totalBenefit=totalBonus+totalMedSavings;
  const totalStars=Object.values(planStarsUsed).reduce((s,v)=>s+v,0);
  return{funded,totalStars,totalBonus,totalMedSavings,totalBenefit,totalCost,netReturn:totalBenefit-totalCost};
}

async function runPortfolioAnalysisBatch(btnId){
  const btn=document.getElementById(btnId);
  const fin=S.oppFinancial||[];
  const unanalyzed=fin.filter(o=>!o.ai_analysis);
  if(!unanalyzed.length){alert('All opportunities already have AI analysis. Ranking is up to date.');return;}
  if(btn){btn.disabled=true;btn.textContent=`Queuing ${unanalyzed.length} analyses…`;}
  const jobs={};
  for(const o of unanalyzed){
    try{
      const resp=await fetch(`${API}/financial/analyze/${o.measure_key}/${o.plan_key}`,{method:'POST'});
      if(resp.ok){const j=await resp.json();if(j.job_id)jobs[j.job_id]={measure_key:o.measure_key,plan_key:o.plan_key};}
    }catch(e){console.error('[batchAnalysis] kick failed',o.measure_key,o.plan_key,e);}
  }
  const total=Object.keys(jobs).length;
  if(!total){if(btn){btn.disabled=false;btn.textContent='Analyze All & Rank';}return;}
  if(btn)btn.textContent=`0/${total} analyses complete…`;
  let done=false,attempts=0;
  while(!done&&attempts<80){
    await new Promise(r=>setTimeout(r,3500));attempts++;
    try{
      const st=await apiGet('/financial/analyze-all/status');
      const pending=Object.keys(jobs).filter(jid=>!st[jid]||st[jid].status!=='complete');
      const nDone=total-pending.length;
      if(btn)btn.textContent=`${nDone}/${total} analyses complete…`;
      if(!pending.length)done=true;
    }catch(e){}
  }
  sessionStorage.setItem('nba_filterPlan',S.filterPlan||'');
  if(S.oppBudget&&S.oppBudget!==50000)sessionStorage.setItem('nba_oppBudget',String(S.oppBudget));
  sessionStorage.setItem('nba_tab','opp');
  window.location.reload();
}

function navigateToOpp(measureKey, planKey){

function launchCampaign(measureKey, planKey){
  const fin=S.oppFinancial||[];
  const opp=fin.find(o=>o.measure_key===measureKey&&o.plan_key===planKey);
  // Store banner info for the Run tab
  S.launchBanner={
    measureKey,planKey,
    measureName:opp?.measure_name||measureKey,
    planName:opp?.plan_name||planKey,
    netReturn:opp?.net_return||0
  };
  // Find the pre-index in S.opportunities (used by startSession for API pre-population)
  const preIdx=(S.opportunities||[]).findIndex(o=>o.measure_key===measureKey&&o.plan_key===planKey);
  // Switch to Run Session tab
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.style.display='none');
  const runTab=document.querySelector('[data-tab="run"]');
  if(runTab) runTab.classList.add('active');
  const runView=document.getElementById('view-run');
  if(runView) runView.style.display='';
  // Auto-start Phase 1 — set tab to 'run' so render() shows the Run Session view
  S.tab='run';
  startSession(preIdx>=0?preIdx:null).then(()=>render());
}

              :o.funding==='partial'

          ['Portfolio Stars improvement','+'+bpPortStars.toFixed(3)+'★','var(--teal)','(funded campaigns only, capped 0.25★/plan)'],
          ['CMS bonus gained',_fmtN(bpTotalBonus),'#16a34a','(Stars quality bonus, funded campaigns only)'],
          ...(bpTotalMedSavings>0?[['+ Medical cost savings',_fmtN(bpTotalMedSavings),'#0891b2','(non-compliance → compliance, funded campaigns only)']]:[]),
          ...(bpTotalMedSavings>0?[['= Total benefit',_fmtN(bpTotalBenefit),'#16a34a','(CMS bonus + medical savings)']]:[]),

        ].map(([l,v,c,scope])=>`<div style="display:flex;justify-content:space-between;align-items:baseline;padding:.35rem 0;border-bottom:1px solid rgba(0,0,0,.06);gap:.5rem">

  <!-- SECTION 5: AI ANALYSIS (collapsed) -->
  <details class="section-card" ${S.aiPanelOpen?'open':''} ontoggle="S.aiPanelOpen=this.open">

    </div>`;

  }
  // Show launch banner at top of active session if launched from Opportunities
  const launchBannerHtml=S.launchBanner?`<div style="background:linear-gradient(135deg,#EAF6F2,#F0FDF4);border:1px solid #A7D9C8;border-radius:8px;padding:.6rem .9rem;margin-bottom:.85rem;display:flex;align-items:center;gap:.6rem">
    <span style="font-size:.9rem">🚀</span>
    <div style="font-size:.75rem;color:var(--g700)">Launching campaign for <strong>${S.launchBanner.measureName}</strong> on <strong>${S.launchBanner.planName.replace('Aurora ','')}</strong> — pre-selected from Opportunities tab</div>
    <button onclick="S.launchBanner=null;renderLeft()" style="margin-left:auto;background:none;border:none;color:var(--g400);cursor:pointer;font-size:.9rem;flex-shrink:0">✕</button>
  </div>`:'';
  const defs=[
    {n:1,agent:'Opportunity Agent',role:'Identifies high-impact measure × plan combinations'},
    {n:2,agent:'Segmentation Agent',role:'Builds interpretable member cohorts'},
    {n:3,agent:'Campaign Design Agent',role:'Designs channel, frequency &amp; incentive strategy'},
    {n:4,agent:'Outreach Agent',role:'Generates per-member contact plan &amp; writes outputs'},
  ];
  const trFind=step=>(S.traceRows.find(t=>t.step===step)||{}).output_summary||'';
  const steps=defs.map(d=>{
    const done=S.phase>d.n,act=S.phase===d.n;
    const cls=done?'completed':act?'active':'pending';
    const dot=done?'✓':d.n;
    const badge=done?'<span class="step-badge-done">Completed</span>':
                act?'<span class="step-badge-active">Active</span>':
                '<span class="step-badge-pending">Pending</span>';
    let sum='';
    if(done){
      if(d.n===1)sum=trFind('OPPORTUNITY_SELECTED')||(S.selOpp?`${S.selOpp.measure.measure_code} × ${S.selOpp.plan.plan_name} — ${S.inScopeGaps.length} gaps`:'Completed');
      if(d.n===2)sum=trFind('COHORTS_ASSIGNED')||(S.selCohorts.length?`${S.selCohorts.length} cohorts · ${S.selCohorts.reduce((s,c)=>s+c.gaps.length,0)} members`:'Completed');
      if(d.n===3)sum=trFind('CAMPAIGN_CREATED')||S.campaign?.name||'Completed';
      if(d.n===4)sum=trFind('OUTREACH_PLAN_CREATED')||`${S.outreachRows.length} contacts · ${S.kpis.cost} est. spend`;
    }
    return`<div class="step-row ${cls}">
      <div class="step-dot">${dot}</div>
      <div class="step-body">
        <div class="step-hdr"><span class="step-agent">${d.agent}</span>${badge}</div>
        <div class="step-role">${d.role}</div>
        ${done&&sum?`<div class="step-summary">✓ ${sum}</div>`:''}
        ${act?renderStepContent(d.n):''}
      </div>
    </div>`;
  }).join('');
  const autoBar=S.autoStatus?`<div class="auto-status-bar"><div class="auto-pulse"></div><span class="as-text">${S.autoStatus}</span></div>`:'';
  const banner=S.phase===5?`<div class="success-banner">
    <div class="sb-icon">✅</div>
    <div class="sb-text">
      <strong>Session Complete — ${S.runId}</strong>
      <span>All outputs written to database. ${S.kpis.contacts} contacts planned.</span>
    </div>
  </div>`:'';
  const gapBanner=(S.phase===5&&S.gapsAfter!==null)?`<div class="gap-banner">
    <div class="gb-icon">📉</div>
    <div class="gb-txt">
      <strong>${S.kpis.gaps} gap${S.kpis.gaps!==1?'s':''} closed this session</strong>
      <span>Open gaps reduced from ${S.gapsBefore} → ${S.gapsAfter} across the portfolio</span>
    </div>
  </div>`:'';
  const evalBanner=S.phase===5&&S.evalScheduledMsg?`<div style="background:var(--teal-ll);border:1px solid var(--teal-m);border-radius:.5rem;padding:.75rem 1rem;margin-top:.75rem;font-size:.82rem;color:var(--teal);display:flex;align-items:center;gap:.5rem"><span>📅</span><span>${S.evalScheduledMsg}</span></div>`:'';
  el.innerHTML=`
  <div class="stepper">
    <div class="stepper-title">${S.runId}</div>
    ${launchBannerHtml}${autoBar}${steps}${banner}${gapBanner}${evalBanner}
  </div>
  ${S.phase===5?`<button class="btn btn-ghost" data-action="reset-session" style="width:100%;margin-top:.5rem">← Start New Session</button>`:''}`;
}

function renderStepContent(n){
  if(n===1)return renderS1();
  if(n===2)return renderS2();
  if(n===3)return renderS3();
  if(n===4)return renderS4();
  return'';
}

function renderS1(){
  const total=S.opportunities.length;
  const si=S.selectedOppIdx!==null?S.selectedOppIdx:0;
  let idxs;
  if(si<=1)idxs=[0,1,2];
  else if(si>=total-2)idxs=[total-3,total-2,total-1];
  else idxs=[si-1,si,si+1];
  idxs=idxs.filter(i=>i>=0&&i<total);

  const cards=idxs.map(i=>{
    const o=S.opportunities[i];
    const isSel=i===S.selectedOppIdx;
    const cls=isSel?'sel-primary':(S.selectedOppIdx!==null?'ctx':'');
    const sw=o.starWeight;const dc=sw===1?'sw-1':sw===1.5?'sw-1-5':'sw-2';
    const now=parseFloat(o.plan.star_rating_current||0).toFixed(1);
    const tgt=parseFloat(o.plan.star_rating_target||0).toFixed(1);
    return`<div class="opp-sel-card ${cls}" data-action="sel-opp" data-val="${i}">
      <div class="osc-header">
        <span class="osc-title">${o.measure.measure_code} × ${o.plan.plan_name||o.plan_key}</span>
        ${isSel?'<span class="badge badge-teal">Selected</span>':`<span class="badge badge-teal">Score ${o.score.toFixed(1)}</span>`}
      </div>
      <div class="osc-meta">
        <span><span class="${dc} sw-dot"></span>wt ${sw}</span>
        <span>${o.openCount} gaps</span>
        <span>${o.avgProp.toFixed(2)} propensity</span>
        <span>${now}→${tgt}★</span>
      </div>
    </div>`;
  }).join('');

  const toggleHtml=S.selectedOppIdx!==null?`
    <div class="mode-toggle-wrap ${S.autoMode?'auto-on':''}" data-action="toggle-auto">
      <div class="mode-toggle-hdr">
        <span class="mode-toggle-label">${S.autoMode?'⚡ Automated Mode':'👤 Manual Mode'}</span>
        <div class="toggle-visual ${S.autoMode?'on':''}"></div>
      </div>
      <div class="mode-desc">${S.autoMode?'AI makes all decisions automatically — each phase runs after a brief pause':'You confirm each agent decision before moving to the next phase'}</div>
    </div>`:'';

  return`<div class="step-content">
    <div style="font-size:.73rem;color:var(--g600)">Select the opportunity to target:</div>
    <div class="opp-sel-cards">${cards}</div>
    ${toggleHtml}
    ${S.selectedOppIdx!==null?
      `<div class="btn-row"><button class="btn btn-primary" data-action="confirm-opp">Confirm Opportunity →</button></div>`:
      `<div style="font-size:.71rem;color:var(--g400);text-align:center">Click a card to select</div>`}
  </div>`;
}

  return'WhatsApp';
}

function renderRight(){
  const el=document.getElementById('run-right');
  const {gaps,contacts,lift,cost}=S.kpis;
  const dim=v=>v==='—';
  const kpis=`<div class="kpi-strip">
    <div class="kpi-tile ${dim(gaps)?'dim':''}"><div class="kpi-label">Gaps Targeted</div><div class="kpi-val">${gaps}</div><div class="kpi-sub">addressable members</div></div>
    <div class="kpi-tile ${dim(contacts)?'dim':''}"><div class="kpi-label">Planned Contacts</div><div class="kpi-val">${contacts}</div><div class="kpi-sub">outreach touches</div></div>
    <div class="kpi-tile ${dim(lift)?'dim':''}"><div class="kpi-label">Expected Lift</div><div class="kpi-val" style="color:var(--teal)">${lift}</div><div class="kpi-sub">avg gap closure</div></div>
    <div class="kpi-tile ${dim(cost)?'dim':''}"><div class="kpi-label">Incentive Cost</div><div class="kpi-val">${cost}</div><div class="kpi-sub">estimated total</div></div>
  </div>`;
  const agents=[{k:'opp',l:'Opportunity'},{k:'seg',l:'Segmentation'},{k:'camp',l:'Campaign'},{k:'out',l:'Outreach'}];
  const pipeHtml=agents.map((a,i)=>{
    const st=S.agentSt[a.k];const sum=S.agentSum[a.k];
    const cls=st==='done'?'done':st==='active'?'active':'idle';
    const ico=st==='done'?'✓':st==='active'?'⟳':'○';
    const lbl=st==='done'?'Completed':st==='active'?'Active':'Waiting';
    return`<div class="pipe-agent ${cls}">
      <div class="pa-name">${ico} ${a.l}</div>
      <div class="pa-status">${lbl}</div>
      ${sum?`<div class="pa-summary">${sum}</div>`:''}
    </div>${i<agents.length-1?'<div class="pipe-arrow">›</div>':''}`;
  }).join('');
  // Demo mode: all channels delivered via WhatsApp
  const chIcon=ch=>'🟢';
  // All channel badges use a single WhatsApp style
  const chCls=()=>'ch-WA';
  const sentCount=S.outreachRows.filter(r=>S.sendState[r.contact_id]?.sent).length;
  const otrRows=S.outreachRows.length?S.outreachRows.map(r=>{
    const dk=S.decisionRows.find(d=>d.member_gap_key===r.member_gap_key);
    const ss=S.sendState[r.contact_id]||{};
    const isCall=r.channel.toLowerCase().includes('call');
    const isScheduled=ss.scheduled||(r.status==='SCHEDULED'&&!ss.sent&&!ss.failed&&!ss.suppressed);
    const isSuppressed=ss.suppressed||(r.status==='SUPPRESSED'&&!ss.sent&&!ss.failed);
    const errTip=ss.error?` title="${String(ss.error).replace(/"/g,"'")}"`:
                 (r.error_reason?` title="${String(r.error_reason).replace(/"/g,"'")}"`:'');
    const overrideTip=ss.override?`<div style="font-size:.67rem;color:#92400E;margin-top:.15rem">↻ ${ss.override}</div>`:'';
    const statusBadge=isSuppressed?`<span class="badge badge-gray"${errTip}>SUPPRESSED</span>`
                     :ss.sent&&isScheduled?`<span class="badge badge-amber">SCHEDULED</span>`
                     :ss.sent?`<span class="badge badge-green">SENT</span>`
                     :ss.failed?`<span class="badge badge-red"${errTip}>FAILED</span>`
                     :r.status==='SUPPRESSED'?`<span class="badge badge-gray">SUPPRESSED</span>`
                     :r.status==='SCHEDULED'?`<span class="badge badge-amber">SCHEDULED</span>`
                     :r.status==='SENT'?`<span class="badge badge-green">SENT</span>`
                     :r.status==='FAILED'?`<span class="badge badge-red"${errTip}>FAILED</span>`
                     :`<span class="badge badge-teal">PLANNED</span>`;
    const preview=S.msgPreviews[r.contact_id];
    const previewHtml=!ss.sent&&!isSuppressed&&preview
      ?`<div class="msg-preview"><div class="msg-preview-label">Message Preview</div>${preview.substring(0,200)}${preview.length>200?'…':''}</div>`
      :!ss.sent&&!isSuppressed&&S.previewsLoading?`<div style="font-size:.68rem;color:var(--g400);font-style:italic">Generating preview…</div>`:'';
    const sentMsg=ss.msg&&ss.sent?`<div class="msg-preview">${ss.msg.substring(0,200)}${ss.msg.length>200?'…':''}</div>`:'';
    const errMsg=(ss.failed&&ss.error)?`<div style="font-size:.68rem;color:var(--red);margin-top:.18rem">${String(ss.error).substring(0,120)}</div>`:'';
    // Action cell: suppressed=nothing, failed=Retry, sent=disabled, else Send/Schedule
    let actionCell='';
    if(isSuppressed){
      actionCell=`<span style="font-size:.7rem;color:var(--g400);font-style:italic">${ss.reason||'DNC'}</span>`;
    }else if(ss.failed||(r.status==='FAILED'&&!ss.sent)){
      actionCell=`<button class="btn-retry" data-action="send-message" data-val="${r.contact_id}">↻ Retry</button>${errMsg}`;
    }else if(ss.loading){
      actionCell=`<button class="btn-send sending" disabled>Sending…</button>`;
    }else if(ss.sent&&isScheduled){
      actionCell=`<button class="btn-send sent" disabled>📞 Scheduled</button>${sentMsg}`;
    }else if(ss.sent){
      actionCell=`<button class="btn-send sent" disabled>✓ Sent</button>${overrideTip}${sentMsg}`;
    }else{
      actionCell=`<button class="btn-send" data-action="send-message" data-val="${r.contact_id}">${isCall?'📞 Schedule':'Send'}</button>${previewHtml}`;
    }
    return`<tr>
      <td><code style="font-size:.7rem">${r.contact_id}</code></td>
      <td>${r.member_gap_key}<br><small style="color:var(--g400)">${dk?.member_key||r.member_gap_key}</small></td>
      <td><span class="ch-icon">${chIcon(r.channel)}</span><span class="ch-WA">${chLabel(r.channel)}</span></td>
      <td>${r.planned_datetime?r.planned_datetime.substring(0,10):'—'}</td>
      <td>${incLabel(r.incentive_offered)}</td>
      <td>${statusBadge}</td>
      <td>${actionCell}</td>
    </tr>`;
  }).join(''):null;

  // Delivery progress panel (auto mode)
  let deliveryPanel='';
  if(S.deliveryInProgress||(S.autoMode&&S.deliveryProgress.total>0)){
    const dp=S.deliveryProgress;
    const done=dp.sent+dp.failed+dp.scheduled;
    const pct=dp.total?Math.round(done/dp.total*100):0;
    const dpRows=S.outreachRows.map(r=>{
      const ss=S.sendState[r.contact_id]||{};
      const icon=chIcon(r.channel);
      const preview=S.msgPreviews[r.contact_id]||'';
      const stEl=ss.loading?`<div class="dp-spinner"></div>`
                :ss.sent&&ss.scheduled?`<span class="badge badge-amber" style="font-size:.65rem">SCHEDULED</span>`
                :ss.sent?`<span style="color:#065F46;font-weight:700">✓</span>`
                :ss.failed?`<span style="color:var(--red);font-weight:700">✗</span>`
                :`<span style="color:var(--g300)">○</span>`;
      return`<div class="dp-row">
        <span class="dp-ch-icon">${icon}</span>
        <div style="flex:1;min-width:0">
          <div class="dp-contact">${r.contact_id} · ${chLabel(r.channel)}</div>
          ${preview?`<div class="dp-msg-preview">${preview.substring(0,80)}…</div>`:''}
        </div>
        ${stEl}
      </div>`;
    }).join('');
    const allDone=!S.deliveryInProgress&&dp.total>0;
    const summary=allDone?`<div class="dp-final-summary">
      Session complete — ${dp.sent} WhatsApp message${dp.sent!==1?'s':''} sent,
      ${dp.scheduled} call${dp.scheduled!==1?'s':''} scheduled
      ${dp.suppressed?` · ${dp.suppressed} suppressed (DNC)`:''}
      ${dp.overridden?` · ${dp.overridden} channel overridden`:''}
      ${dp.failed?` · ${dp.failed} failed`:''}
    </div>`:'';
    deliveryPanel=`<div class="delivery-panel">
      <div class="delivery-panel-hdr">
        <h3>${S.deliveryInProgress?'Delivering messages…':'Delivery complete'}</h3>
        <span class="dp-counts">${done} / ${dp.total}</span>
      </div>
      <div class="dp-bar-wrap"><div class="dp-bar-fill" style="width:${pct}%"></div></div>
      ${dpRows}${summary}
    </div>`;
  }

  const suppressedCount=S.outreachRows.filter(r=>(S.sendState[r.contact_id]?.suppressed)||(r.status==='SUPPRESSED'&&!S.sendState[r.contact_id]?.sent)).length;
  const failedCount=S.outreachRows.filter(r=>S.sendState[r.contact_id]?.failed).length;
  const sendSummary=sentCount>0?`<span class="send-count-badge">✓ ${sentCount} sent${suppressedCount?` · ${suppressedCount} suppressed (DNC/no consent)`:''}${failedCount?` · ${failedCount} failed`:''}</span>`:'';
  // Send All is now automatic on Confirm & Finalise — no manual button needed
  const manualLabel='';
  const sendAllBtn='';

  const trcRows=S.traceRows.length?S.traceRows.map((r,i)=>`<tr class="${i>=S.lastTraceSeen?'trace-new':''}">
    <td><code style="font-size:.69rem">${r.timestamp?String(r.timestamp).substring(11,19):'—'}</code></td>
    <td><strong>${r.agent}</strong></td>
    <td><span class="badge badge-gray">${r.step}</span></td>

    <td><span class="badge badge-teal">${r.affected_population_count}</span></td>
  </tr>`).join(''):null;
  S.lastTraceSeen=S.traceRows.length;
  el.innerHTML=`
  ${kpis}

  </div>

  <div class="table-wrap">${otrRows?`<table><thead><tr><th>Contact ID</th><th>Gap / Member</th><th>Channel</th><th>Date</th><th>Incentive</th><th>Status</th><th>Action / Preview</th></tr></thead><tbody>${otrRows}</tbody></table>`:`<div class="empty-table">Outreach plan will appear after campaign confirmation.</div>`}</div>

/* ── Events ────────────────────────────────────────────────────────── */
// Filter dropdowns (change event — not click)
document.addEventListener('change',e=>{
  const flt=e.target.dataset.filter;
  if(flt){
    if(flt==='plan')S.filterPlan=e.target.value;
    else if(flt==='measure')S.filterMeasure=e.target.value;
    else if(flt==='priority')S.filterPriority=e.target.value;
    renderOpp();return;
  }
  const ce=e.target.dataset.campEdit;
  if(ce){
    const orig=e.target.dataset.orig||'';
    if(e.target.value!==orig)S.campEdits[ce]=e.target.value;
    else delete S.campEdits[ce];
    // Highlight edited state without full re-render
    e.target.classList.toggle('edited',!!S.campEdits[ce]);
    // Update the footer note
    const footer=document.querySelector('.camp-edit-note');
    if(footer){
      const n=Object.keys(S.campEdits).length;
      footer.textContent=n?`⚠ ${n} field${n!==1?'s':''} manually changed — will be noted in audit trace`:'No changes — using AI recommendation';
    }
    return;
  }
});

// Camp-edit text inputs (input event for live amber highlight)
document.addEventListener('input',e=>{
  const ce=e.target.dataset.campEdit;
  if(!ce||e.target.type!=='text')return;
  const orig=e.target.dataset.orig||'';
  if(e.target.value!==orig)S.campEdits[ce]=e.target.value;
  else delete S.campEdits[ce];
  e.target.classList.toggle('edited',!!S.campEdits[ce]);
  const footer=document.querySelector('.camp-edit-note');
  if(footer){
    const n=Object.keys(S.campEdits).length;
    footer.textContent=n?`⚠ ${n} field${n!==1?'s':''} manually changed — will be noted in audit trace`:'No changes — using AI recommendation';
  }
});

document.addEventListener('click',e=>{
  // Close history dropdown on outside click
  if(S.historyOpen&&!e.target.closest('#history-wrap')){
    S.historyOpen=false;renderNav();
  }
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,v=el.dataset.val;
  switch(a){
    case 'switch-tab':
      S.tab=v;render();
      if(v==='eval'){
        // Load conversations for all campaigns when switching to eval tab
        if(S.evalData){S.evalData.campaigns.forEach(c=>loadConversations(c.nba_run_id));}
        startConvPolling();
      } else {
        stopConvPolling();
      }
      break;
    case 'sel-opp-radar':  startSession(+v).then(()=>{S.tab='run';render();});break;
    case 'start-session':  startSession().then(()=>render());break;
    case 'sel-opp':        S.selectedOppIdx=+v;render();break;
    case 'confirm-opp':    if(S.selectedOppIdx!==null)confirmOpp();break;
    case 'sel-cohorts':    S.cohortSelPending=v;render();break;
    case 'confirm-cohorts':confirmCohorts(v);break;
    case 'go-back':        goBack(+v);break;
    case 'sel-camp':       S.campIdx=+v;S.campEdits={};render();break;
    case 'confirm-camp':   if(S.campIdx!==null)confirmCampaign();break;
    case 'finalize':       finalizeSession();break;
    case 'reset-session':  resetSession();break;
    case 'clear-filters':  S.filterPlan='';S.filterMeasure='';S.filterPriority='';renderOpp();break;
    case 'toggle-auto':
      S.autoMode=!S.autoMode;
      if(!S.autoMode&&S.autoStatus){S.autoAborted=true;S.autoStatus=null;}
      render();break;
    case 'toggle-history':
      S.historyOpen=!S.historyOpen;
      if(S.historyOpen)loadSessionHistory();else renderNav();
      break;
    case 'load-session':   loadSessionById(v);break;
    case 'send-message':
      (async()=>{
        const cid=v;
        S.sendState[cid]={loading:true};renderRight();
        try{
          const res=await apiPost(`/send/message/${cid}`,{});
          if(res.status==='SUPPRESSED'){
            S.sendState[cid]={suppressed:true,reason:res.error||'Do Not Contact'};
          }else if(res.success){
            S.sendState[cid]={sent:true,scheduled:res.status==='SCHEDULED',msg:res.message_text,override:res.override_note||null};
            if(res.message_text)S.msgPreviews[cid]=res.message_text;
          }else{
            S.sendState[cid]={failed:true,msg:res.message_text,error:res.error||'Delivery failed'};
          }
        }catch(err){
          S.sendState[cid]={failed:true,error:String(err)};
        }
        renderRight();
      })();
      break;
    case 'send-all':
      (async()=>{
        S.sendAllInProgress=true;renderRight();
        try{
          const res=await apiPost(`/send/all/${S.runId}`,{});
          const results=res.results||[];
          for(const r of results){
            if(r.status==='SUPPRESSED'){
              S.sendState[r.contact_id]={suppressed:true,reason:r.error||'Do Not Contact'};
            }else if(r.success){
              S.sendState[r.contact_id]={sent:true,scheduled:r.status==='SCHEDULED',msg:r.message_text,override:r.override_note||null};
              if(r.message_text)S.msgPreviews[r.contact_id]=r.message_text;
            }else{
              S.sendState[r.contact_id]={failed:true,msg:r.message_text,error:r.error||'Failed'};
            }
          }
        }catch(err){
          console.error('send-all error',err);
        }
        S.sendAllInProgress=false;renderRight();
        await refreshOpportunities();
      })();
      break;
  }
});

    },400);
  }
  render();
});

      <div class="ds-section-title" style="color:var(--g400)">More Connectors — Coming Soon</div>
      <div style="display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.65rem">
        ${['Snowflake','Databricks','SQL Server','BigQuery','Azure Synapse','Redshift'].map(name=>`
        <div style="border:1px solid var(--g200);border-radius:var(--r);padding:.6rem .9rem;background:var(--white);display:flex;align-items:center;gap:.5rem">
          <span style="font-size:.78rem;font-weight:600;color:var(--g500)">${name}</span>
          <span style="font-size:.65rem;padding:.1rem .4rem;background:var(--g100);color:var(--g400);border-radius:3px">Coming Soon</span>
          <button style="font-size:.67rem;padding:.1rem .4rem;background:none;border:1px solid var(--g200);border-radius:3px;color:var(--g400);cursor:pointer" onclick="dsNotifyMe('${name}')">Notify me</button>
        </div>`).join('')}
      </div>
    </div>

    <!-- Current Data Status -->
    <div class="ds-section">
      <div class="ds-section-title">Current Data Status</div>
      <div class="ds-status-table">
        <table>
          <thead><tr><th>Data Source</th><th>Records</th><th>Status</th><th>Last Updated</th></tr></thead>
          <tbody>
            <tr><td>Member Roster</td><td>${(s.members?.count||0).toLocaleString()}</td><td><span class="badge badge-green">Active</span></td><td>${s.members?.updated||'—'}</td></tr>
            <tr><td>Care Gaps</td><td>${(s.gaps?.count||0).toLocaleString()}</td><td><span class="badge badge-green">Active</span></td><td>${s.gaps?.updated||'—'}</td></tr>
            <tr><td>Plan Contracts</td><td>${(s.plans?.count||0).toLocaleString()}</td><td><span class="badge badge-green">Active</span></td><td>${s.plans?.updated||'—'}</td></tr>
            <tr><td>NBA Sessions</td><td>${(s.runs?.count||0).toLocaleString()}</td><td><span class="badge badge-blue">Runs</span></td><td>—</td></tr>
          </tbody>
        </table>
      </div>
      <div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
        <button class="ds-btn-danger" onclick="dsResetData()" id="ds-reset-btn">
          ${DS.resetting ? '<span class="ds-spinner"></span>Restoring…' : '↺ Reset to Demo Data'}
        </button>
        <span style="font-size:.74rem;color:var(--g400)">Restores all synthetic demo data</span>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="ds-modal-backdrop ${DS.modalOpen ? 'open' : ''}" id="ds-modal-backdrop" onclick="dsBackdropClick(event)">
    <div class="ds-modal" id="ds-modal">
      <div class="ds-modal-hdr">
        <span class="ds-modal-title">Upload Data File</span>
        <button class="ds-modal-close" onclick="dsCloseModal()">✕</button>
      </div>
      ${dsRenderModalBody()}
    </div>
  </div>
  `;
}

async function dsActivateSource(sourceId, sourceName) {
  try {
    await fetch(`${API}/data/sources/activate/${sourceId}`, {method:'POST'});
    activeSourceId = sourceId;
    activeSourceName = sourceName;
    await loadSources();
    await loadDataStatus();
    renderDataSources();
    loadData(); // refresh opportunities
  } catch(e) { alert('Failed to activate source: ' + e); }
}

async function dsDeleteSource(sourceId) {
  if (!confirm('Delete this data source? This cannot be undone.')) return;
  try {
    await fetch(`${API}/data/sources/${sourceId}`, {method:'DELETE'});
    await loadSources();
    renderDataSources();
  } catch(e) { alert('Failed to delete: ' + e); }
}

async function dsDownloadTemplate(type) {
  const url = `${API}/data/templates/${type}`;
  const a = document.createElement('a');
  a.href = url;
  a.download = `${type}_template.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function dsNotifyMe(name) {
  const toast = document.createElement('div');
  toast.textContent = `✓ We'll notify you when ${name} connector is ready`;
  toast.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;background:#1F2937;color:#fff;padding:.6rem 1rem;border-radius:6px;font-size:.8rem;z-index:9999;animation:fadeIn .2s';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 3000);
}

function dsHandleDropMain(e) {
  e.preventDefault();
  document.getElementById('drop-zone')?.classList.remove('dragover');
  const file = e.dataTransfer?.files?.[0];
  if (file) dsHandleFileMain(file);
}

function dsHandleFileMain(file) {
  DS.file = file;
  DS.importResult = null; DS.importing = false;
  // Open the modal immediately so user doesn't have to click the button separately
  DS.modalOpen = true;
  renderDataSources();
  setTimeout(()=>{
    const dz=document.getElementById('ds-drop-zone');
    if(dz) dz.onclick=()=>document.getElementById('ds-file-input')?.click();
  },0);
}

function dsRenderModalBody() {
  const uploading = DS.importing;
  const r = DS.importResult;

  if (uploading) {
    return `
      <div style="text-align:center;padding:2rem 1rem">
        <div class="loading-spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto .75rem"></div>
        <div style="font-size:.9rem;font-weight:600;color:var(--g800);margin-bottom:.35rem">Uploading &amp; Analyzing…</div>
        <div style="font-size:.78rem;color:var(--g500)">Detecting data types, importing rows, and running AI analysis. This takes about 15–30 seconds.</div>
      </div>`;
  }

  if (r) {
    if (r.error) {
      return `
        <div class="ds-error-list" style="margin:.5rem 0">${r.error}</div>
        <div style="display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem">
          <button class="ds-btn-outline" onclick="dsCloseModal();loadDataStatus().then(()=>renderDataSources())">Close</button>
          <button class="ds-btn" onclick="DS.importResult=null;DS.file=null;dsRenderModal()">Try Again</button>
        </div>`;
    }
    const tables = r.tables_loaded || [];
    const tableList = tables.length ? `<div style="font-size:.78rem;color:var(--g600);margin-top:.5rem">Loaded: ${tables.join(' · ')}</div>` : '';
    return `
      <div class="ds-success-banner" style="margin:.5rem 0">
        ✔ <strong>${r.rows_imported||r.imported||0} rows imported</strong> — AI analysis running in background
        ${tableList}
      </div>
      <div style="font-size:.78rem;color:var(--g500);margin:.6rem 0">Head to <strong>Opportunities</strong> in a few seconds to see Claude's recommendations.</div>
      <div style="display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem">
        <button class="ds-btn-outline" onclick="dsCloseModal();loadDataStatus().then(()=>renderDataSources())">Close</button>
        <button class="ds-btn" onclick="dsCloseModal();S.tab='opp';render()">View Opportunities →</button>
      </div>`;
  }

  // Default: file picker
  return `
    <div style="font-size:.82rem;color:var(--g600);margin-bottom:.85rem">
      Upload your Excel workbook or CSV file. Members, gaps, and plans are all detected automatically — no need to upload them separately.
    </div>
    <div class="ds-drop-zone" id="ds-drop-zone"
      ondragover="event.preventDefault();this.classList.add('dragover')"
      ondragleave="this.classList.remove('dragover')"
      ondrop="dsHandleDrop(event)">
      <div class="ds-drop-icon">📊</div>
      <div class="ds-drop-hint">Drag &amp; drop your file here or <strong>click to browse</strong></div>
      <input type="file" accept=".csv,.xlsx" style="display:none" id="ds-file-input" onchange="dsHandleFile(this.files[0])">
      <div style="font-size:.7rem;color:var(--g300);margin-top:.3rem">Accepts: .xlsx (recommended) · .csv · Max 50MB</div>
    </div>
    ${DS.file ? `<div class="ds-file-chosen">✔ ${DS.file.name} (${(DS.file.size/1024).toFixed(1)} KB)</div>` : ''}
    <div style="display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem">
      <button class="ds-btn-outline" onclick="dsCloseModal()">Cancel</button>
      <button class="ds-btn" ${!DS.file?'disabled style="opacity:.5;cursor:not-allowed"':''} onclick="dsImport()">⬆ Upload &amp; Analyze</button>
    </div>`;
}

function dsRenderModal() {
  const modal = document.getElementById('ds-modal');
  if (modal) modal.innerHTML = `
    <div class="ds-modal-hdr">
      <span class="ds-modal-title">Upload Data</span>
      <button class="ds-modal-close" onclick="dsCloseModal()">✕</button>
    </div>
    ${dsRenderModalBody()}`;
  const dz = document.getElementById('ds-drop-zone');
  if (dz) dz.onclick = () => document.getElementById('ds-file-input')?.click();
}

function dsOpenUploadModal() {
  DS.modalOpen = true; DS.importResult = null; DS.importing = false;
  // Don't clear DS.file — preserve any file already picked via drag-drop
  renderDataSources();
  setTimeout(()=>{
    const dz=document.getElementById('ds-drop-zone');
    if(dz) dz.onclick=()=>document.getElementById('ds-file-input')?.click();
  },0);
}

function dsOpenModal() { dsOpenUploadModal(); }

function dsCloseModal() {
  DS.modalOpen = false;
  renderDataSources();
}

function dsBackdropClick(e) {
  if (e.target.id === 'ds-modal-backdrop') dsCloseModal();
}

function dsHandleDrop(e) {
  e.preventDefault();
  document.getElementById('ds-drop-zone')?.classList.remove('dragover');
  const file = e.dataTransfer?.files?.[0];
  if (file) dsHandleFile(file);
}

function dsHandleFile(file) {
  DS.file = file;
  dsRenderModal();
  const dz = document.getElementById('ds-drop-zone');
  if (dz) dz.onclick = () => document.getElementById('ds-file-input')?.click();
}

function dsParseAndPreview() {
  if (!DS.file) return;
  DS.step = 4;
  if (typeof Papa !== 'undefined') {
    Papa.parse(DS.file, {
      header: true,
      skipEmptyLines: true,
      complete(results) {
        DS.parsedHeaders = results.meta.fields || [];
        DS.parsedRows = results.data || [];
        dsRenderModal();
      },
      error() {
        DS.parsedHeaders = []; DS.parsedRows = [];
        dsRenderModal();
      }
    });
  } else {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const lines = (ev.target.result || '').split('\n').filter(Boolean);
      if (!lines.length) { dsRenderModal(); return; }
      DS.parsedHeaders = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
      DS.parsedRows = lines.slice(1).map(line => {
        const vals = line.split(',');
        const obj = {};
        DS.parsedHeaders.forEach((h, i) => obj[h] = (vals[i]||'').trim().replace(/^"|"$/g,''));
        return obj;
      });
      dsRenderModal();
    };
    reader.readAsText(DS.file);
  }
}

const DS_REQUIRED = {
  members: ['member_id','date_of_birth','gender','language_preference','digital_literacy_segment','socioeconomic_segment'],
  gaps:    ['member_id','measure_code','plan_id','measurement_year','gap_status','gap_open_date','clinical_risk_score','days_open'],
  plans:   ['plan_id','plan_name','region','segment','current_star_rating','target_star_rating'],
};

function dsMissingCols() {
  const req = DS_REQUIRED[DS.dataType] || [];
  return req.filter(c => !DS.parsedHeaders.includes(c));
}

async function dsImport() {
  if (!DS.file) return;
  DS.importing = true; DS.importResult = null;
  dsRenderModal();
  try {
    const fd = new FormData();
    fd.append('files', DS.file);
    const res = await fetch(`${API}/datasource/upload`, { method: 'POST', body: fd });
    const json = await res.json();
    if (!res.ok) {
      DS.importResult = { error: json.detail || json.error || `Upload failed (HTTP ${res.status})` };
    } else {
      // Poll status until done
      const runId = json.run_id;
      let done = false;
      for (let i = 0; i < 60 && !done; i++) {
        await new Promise(r => setTimeout(r, 2000));
        try {
          const st = await fetch(`${API}/datasource/status/${runId}`);
          if (st.ok) {
            const s = await st.json();
            if (s.phase === 'complete' || s.phase === 'failed') {
              done = true;
              if (s.phase === 'failed') {
                DS.importResult = { error: (s.results||[]).map(r=>r.error||r.message||'').filter(Boolean).join('; ') || 'Import failed' };
              } else {
                const totalRows = (s.results||[]).reduce((acc,r)=>acc+(r.imported||r.rows_imported||0),0);
                const tables = (s.results||[]).map(r=>r.table||r.tables||'').filter(Boolean);
                DS.importResult = { rows_imported: totalRows, tables_loaded: tables };
              }
            }
          }
        } catch(e) { /* keep polling */ }
      }
      if (!done) DS.importResult = { rows_imported: json.rows_received || 0, tables_loaded: [] };
      await loadSources();
      loadData();
    }
  } catch(e) {
    DS.importResult = { error: String(e) };
  }
  DS.importing = false;
  dsRenderModal();
}

async function dsResetData() {
  if (!confirm('This will restore all demo data and overwrite any uploaded data. Continue?')) return;
  DS.resetting = true;
  renderDataSources();
  try {
    const res = await fetch(`${API}/data/reset`, { method: 'POST' });
    if (res.ok) {
      await loadDataStatus();
      await loadSources();
      loadData();
    }
  } catch(e) { /* ignore */ }
  DS.resetting = false;
  renderDataSources();
}
</script>
